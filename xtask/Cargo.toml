[package]
name = "xtask"
description = "Mandara dev and release tooling: versioning, fingerprinted builds, packaging, checksums, resource budget, headless demo sandbox"
version = "0.7.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mandara-version.workspace = true
# `cargo xtask langpacks` / `dist` / `sandbox`: compiles the language packs.
mandara-i18n.workspace = true
sha2.workspace = true
tar.workspace = true
flate2.workspace = true
# `cargo xtask art`: plugin artwork pipeline (embedding, cover composition, checks).
image.workspace = true
# The same resvg as GPUI. The brand marks and plugin icons have no text or
# embedded images (`cargo xtask art --check` enforces it), so no text or
# raster-image support.
resvg = { version = "0.46", default-features = false }
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
ab_glyph = "0.2"
# `cargo xtask art --calligraphy`: Arabic shaping for the main menu's Kufic
# words (the version GPUI's text stack already locks).
rustybuzz = "0.20"
# 1.x: the version image / gif link; 2.0 would be a second copy.
color_quant = "1.1"
png = "0.18"
# Embedded icons: pixel-exact lossless WebP (pure Rust, no dependencies).
mandara-webp.workspace = true
serde.workspace = true
serde_json.workspace = true
# `cargo xtask build`: reads feature lists, writes the build manifest.
toml = { workspace = true, features = ["display"] }
# `cargo xtask delta` / `update-part` / `plugin-delta`: binary patches and
# update.json (bidiff + zstd encoder; the shell links only the apply side).
mandara-delta = { workspace = true, features = ["create", "sign"] }
# `cargo xtask resource-check` / `sandbox`: process control and /proc
# (kill, setsid, rlimits, parent-death signal, clock ticks).
rustix.workspace = true
# `cargo xtask sandbox pointer`: the virtual pointer (shared source with
# mandara-services' `vpointer`) on the sandbox's own Wayland socket.
anyhow.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true
# `cargo xtask sandbox audio` / `notify`: the demo MPRIS player and demo
# notifications on the sandbox's private session bus.
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

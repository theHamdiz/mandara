<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Desktop shortcuts and you</title>
  <defs>
    <linearGradient id="identity-tile" x1="64" y1="40" x2="448" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C1C22"/><stop offset="1" stop-color="#09090C"/>
    </linearGradient>
    <radialGradient id="identity-light" cx="0" cy="0" r="1" gradientTransform="translate(98 48) rotate(45) scale(440 354)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="identity-rim" x1="76" y1="28" x2="446" y2="482" gradientUnits="userSpaceOnUse">

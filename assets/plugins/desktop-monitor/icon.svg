<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>System monitor</title>
  <defs>
    <linearGradient id="monitor-tile" x1="64" y1="40" x2="448" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C1C22"/><stop offset="1" stop-color="#09090C"/>
    </linearGradient>
    <radialGradient id="monitor-light" cx="0" cy="0" r="1" gradientTransform="translate(98 48) rotate(45) scale(440 354)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="monitor-rim" x1="76" y1="28" x2="446" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".72"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".24"/>
    </linearGradient>
    <clipPath id="monitor-clip"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#monitor-tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#monitor-light)"/>
  <g clip-path="url(#monitor-clip)">
    <path d="M-28 324C126 476 349 518 544 274v238H-28z" fill="#FFFFFF" opacity=".045"/>
  </g>
  <rect x="19" y="19" width="474" height="474" rx="105" stroke="url(#monitor-rim)" stroke-width="2"/>
  <g stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <g opacity=".16">
      <circle cx="256" cy="256" r="144" stroke="#D9B061"/>
      <circle cx="256" cy="256" r="100" stroke="#34D399"/>
      <circle cx="256" cy="256" r="56" stroke="#FFF2D5"/>
    </g>
    <g transform="rotate(-90 256 256)">
      <circle cx="256" cy="256" r="144" stroke="#D9B061" stroke-dasharray="723.82 180.96"/>
      <circle cx="256" cy="256" r="100" stroke="#34D399" stroke-dasharray="376.99 251.33"/>
      <circle cx="256" cy="256" r="56" stroke="#FFF2D5" stroke-dasharray="133.71 218.15"/>

      <stop offset="1" stop-color="#092D4D"/>
    </linearGradient>
    <radialGradient id="glass" cx="152" cy="112" r="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6FFF4" stop-opacity=".22"/>

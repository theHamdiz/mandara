[package]
name = "mandara-install"
description = "Mandara Shell's installer (`mandara install` / `uninstall`): distribution package tables and the package-manager abstraction shared with Mandara Login"
version = "0.18.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mandara-version.workspace = true
# Language packs: copied next to the installed binary's version, checked first.
mandara-i18n.workspace = true
# Release archives: SHA-256, SHA256SUMS lookups, update.json, tar.gz entries.
mandara-delta.workspace = true
clap.workspace = true
serde_json.workspace = true
ureq.workspace = true
libc.workspace = true
tempfile.workspace = true

[dev-dependencies]
flate2.workspace = true
tar.workspace = true
# Tests sign their fake releases with a key of their own.
mandara-delta = { workspace = true, features = ["sign"] }

[lints]
workspace = true

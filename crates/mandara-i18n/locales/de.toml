# ── Quotes ──
"{author}, {work}" = "{author}, {work}"
"A man does not attain everything that he desires; the winds convey whither the ships do not list." = "Nicht alles, was der Mensch sich wünscht, erreicht er; die Winde wehen, wohin die Schiffe nicht wollen."
"A charger's saddle is an exalted throne, the best companions are books alone." = "Der Sattel eines edlen Rosses ist ein erhabener Thron, die besten Gefährten sind allein die Bücher."
"If you venture in pursuit of glory, don't be satisfied with less than the stars." = "Wenn du nach Ruhm strebst, gib dich mit nichts Geringerem als den Sternen zufrieden."
"The past resembles the future more than water resembles water." = "Die Vergangenheit gleicht der Zukunft mehr als Wasser dem Wasser."
"Skills are acquired only through the repetition of actions." = "Fertigkeiten erwirbt man nur durch die Wiederholung von Handlungen."
"The knowledge of anything, since all things have causes, is not acquired or complete unless it is known by its causes." = "Die Erkenntnis einer Sache ist, da alle Dinge Ursachen haben, weder erworben noch vollständig, solange sie nicht aus ihren Ursachen erkannt ist."
"The less reason someone has, the more he fancies himself the most rational and most discerning of all." = "Je weniger Verstand jemand hat, desto mehr hält er sich für den Vernünftigsten und Urteilsfähigsten von allen."
"Friendship is always a sweet responsibility, never an opportunity." = "Freundschaft ist immer eine süße Verantwortung, niemals eine Gelegenheit."
"A sense of humour is a sense of proportion." = "Sinn für Humor ist Sinn für das rechte Maß."
"If you sing of beauty though alone in the heart of the desert you will have an audience." = "Wenn du von Schönheit singst, und sei es allein im Herzen der Wüste, wirst du Zuhörer haben."
"Work is love made visible." = "Arbeit ist sichtbar gemachte Liebe."
"You give but little when you give of your possessions. It is when you give of yourself that you truly give." = "Du gibst nur wenig, wenn du von deinem Besitz gibst. Erst wenn du von dir selbst gibst, gibst du wahrhaft."
"Patience is man's refuge in times of despair, and his armor against misfortunes." = "Geduld ist die Zuflucht des Menschen in Zeiten der Verzweiflung und seine Rüstung gegen das Unglück."
"Knowledge is like water and air: it is every citizen's right to enjoy it for free." = "Wissen ist wie Wasser und Luft: Jeder Bürger hat das Recht, es kostenlos zu genießen."
"Time is like a sword; if you don't cut it, it'll cut you." = "Die Zeit ist wie ein Schwert; wenn du sie nicht schneidest, schneidet sie dich."
"All men by nature desire to know." = "Alle Menschen streben von Natur aus nach Wissen."
"For the things we have to learn before we can do, we learn by doing." = "Denn was wir erst lernen müssen, bevor wir es tun können, das lernen wir, indem wir es tun."
"The roots of education are bitter, but the fruit is sweet." = "Die Wurzeln der Bildung sind bitter, aber die Frucht ist süß."
"The beginning is the most important part of any work." = "Der Anfang ist der wichtigste Teil jedes Werkes."
"You could not step twice into the same river." = "Man kann nicht zweimal in denselben Fluss steigen."
"While we are postponing, life speeds by." = "Während wir aufschieben, eilt das Leben vorüber."
"We suffer more often in imagination than in reality." = "Wir leiden öfter in der Einbildung als in der Wirklichkeit."
"It is not that we have a short space of time, but that we waste much of it." = "Es ist nicht so, dass wir wenig Zeit haben, sondern dass wir viel davon verschwenden."
"He who receives a benefit with gratitude, repays the first installment of it." = "Wer eine Wohltat dankbar empfängt, hat die erste Rate schon zurückgezahlt."
"Fire tries gold, misfortune tries brave men." = "Das Feuer prüft das Gold, das Unglück tapfere Männer."
"No longer talk at all about the kind of man that a good man ought to be, but be such." = "Rede nicht länger darüber, wie ein guter Mensch sein soll, sondern sei einer."
"Very little indeed is necessary for living a happy life." = "Sehr wenig nur ist nötig, um ein glückliches Leben zu führen."
"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig." = "Schau nach innen. Im Innern ist die Quelle des Guten, und sie wird immer sprudeln, wenn du immer gräbst."
"If it is not right, do not do it: if it is not true, do not say it." = "Wenn es nicht recht ist, tu es nicht; wenn es nicht wahr ist, sag es nicht."
"Confine thyself to the present." = "Beschränke dich auf die Gegenwart."
"First say to yourself what you would be; and then do what you have to do." = "Sag dir zuerst, wer du sein willst; und dann tu, was du zu tun hast."
"No thing great is created suddenly, any more than a bunch of grapes or a fig." = "Nichts Großes entsteht plötzlich, so wenig wie eine Weintraube oder eine Feige."
"Men are disturbed not by things, but by the views which they take of things." = "Nicht die Dinge beunruhigen die Menschen, sondern ihre Ansichten über die Dinge."
"He who has begun has half done. Dare to be wise; begin!" = "Wer begonnen hat, hat schon halb vollendet. Wage es, weise zu sein; fang an!"
"Practice is the best of all instructors." = "Übung ist der beste Lehrmeister."
"Anyone can hold the helm when the sea is calm." = "Das Steuer halten kann jeder, wenn das Meer ruhig ist."
"They can because they think they can." = "Sie können, weil sie glauben, dass sie können."
"If you have a garden and a library, you have everything you need." = "Wenn du einen Garten und eine Bibliothek hast, hast du alles, was du brauchst."
"Drops of water hollow out a stone." = "Steter Tropfen höhlt den Stein."
"Slow and steady wins the race." = "Langsam, aber stetig gewinnt das Rennen."
"Is it not pleasant to learn with a constant perseverance and application?" = "Ist es nicht eine Freude, zu lernen und mit beständiger Ausdauer zu üben?"
"If a man keeps cherishing his old knowledge, so as continually to be acquiring new, he may be a teacher of others." = "Wer das Alte bewahrt und dabei stets Neues hinzulernt, der kann anderen ein Lehrer sein."
"Learning without thought is labour lost; thought without learning is perilous." = "Lernen ohne zu denken ist eitel; denken ohne zu lernen ist gefährlich."
"When I walk along with two others, they may serve me as my teachers." = "Wenn ich mit zwei anderen gehe, können sie mir als Lehrer dienen."
"When the year becomes cold, then we know how the pine and the cypress are the last to lose their leaves." = "Wenn das Jahr kalt wird, erkennen wir, dass Kiefer und Zypresse als letzte ihre Blätter verlieren."
"Do not be desirous to have things done quickly; do not look at small advantages." = "Wünsche nicht, dass die Dinge schnell erledigt werden; achte nicht auf kleine Vorteile."
"What you do not want done to yourself, do not do to others." = "Was du selbst nicht wünschst, das tu auch anderen nicht an."
"The journey of a thousand li commenced with a single step." = "Eine Reise von tausend Li beginnt mit einem einzigen Schritt."
"He who knows other men is discerning; he who knows himself is intelligent." = "Wer andere kennt, ist klug; wer sich selbst kennt, ist weise."
"He who overcomes others is strong; he who overcomes himself is mighty." = "Wer andere besiegt, hat Kraft; wer sich selbst besiegt, ist stark."
"The soft overcomes the hard; and the weak the strong." = "Das Weiche besiegt das Harte, das Schwache das Starke."
"The great man is the one who does not lose his child's heart." = "Der große Mensch ist der, der sein Kinderherz nicht verliert."
"You cannot speak of ocean to a well-frog." = "Mit einem Brunnenfrosch kann man nicht über das Meer reden."
"If you know the enemy and know yourself, you need not fear the result of a hundred battles." = "Wenn du den Feind kennst und dich selbst kennst, brauchst du den Ausgang von hundert Schlachten nicht zu fürchten."
"Let right deeds be thy motive, not the fruit which comes from them." = "Lass rechtes Handeln dein Beweggrund sein, nicht die Frucht, die daraus erwächst."
"Hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule." = "Hass hört niemals durch Hass auf; Hass hört durch Liebe auf – das ist ein altes Gesetz."
"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise." = "Wie ein fester Fels vom Wind nicht erschüttert wird, so wanken die Weisen nicht inmitten von Tadel und Lob."
"Real kindness seeks no return; what return can the world make to rain clouds?" = "Wahre Güte verlangt keine Gegenleistung; was kann die Welt den Regenwolken zurückgeben?"
"To use bitter words, when kind words are at hand, is like picking unripe fruit when the ripe fruit is there." = "Bittere Worte zu gebrauchen, wenn freundliche zur Hand sind, ist, als pflücke man unreife Früchte, wo reife da sind."
"If you shed tears when you miss the sun, you also miss the stars." = "Wenn du Tränen vergießt, weil dir die Sonne fehlt, entgehen dir auch die Sterne."
"We come nearest to the great when we are great in humility." = "Wir kommen den Großen am nächsten, wenn wir groß in der Demut sind."
"If you shut your door to all errors truth will be shut out." = "Wenn du allen Irrtümern die Tür verschließt, sperrst du auch die Wahrheit aus."
"The roots below the earth claim no rewards for making the branches fruitful." = "Die Wurzeln unter der Erde verlangen keinen Lohn dafür, dass sie die Zweige fruchtbar machen."
"He who is too busy doing good finds no time to be good." = "Wer zu sehr damit beschäftigt ist, Gutes zu tun, findet keine Zeit, gut zu sein."
"Let your life lightly dance on the edges of Time like dew on the tip of a leaf." = "Lass dein Leben leicht auf den Rändern der Zeit tanzen wie Tau auf der Spitze eines Blattes."
"If you are irritated by every rub, how will your mirror be polished?" = "Wenn dich jede Reibung reizt, wie soll dein Spiegel je poliert werden?"
"If you are wholly perplexed and in straits, have patience, for patience is the key to joy." = "Wenn du ganz ratlos und in Bedrängnis bist, hab Geduld, denn Geduld ist der Schlüssel zur Freude."
"Come, seek, for search is the foundation of fortune: every success depends upon focusing the heart." = "Komm, suche, denn das Suchen ist das Fundament des Glücks: Jeder Erfolg hängt davon ab, das Herz zu sammeln."
"If thou covetest riches, ask not but for contentment, which is an immense treasure." = "Wenn du nach Reichtum verlangst, bitte um nichts als Genügsamkeit, denn sie ist ein unermesslicher Schatz."
"Use a sweet tongue, courtesy, and gentleness, and thou mayst manage to guide an elephant with a hair." = "Mit süßer Zunge, Höflichkeit und Sanftmut kannst du einen Elefanten an einem Haar führen."
"Were the diver to think on the jaws of the shark, he would never lay hands on the precious pearl." = "Dächte der Taucher an den Rachen des Hais, er würde nie die kostbare Perle ergreifen."
"How well said the aged farmer to his son, O light of my eyes, thou wilt not reap save that which thou hast sown." = "Wie schön sprach der alte Bauer zu seinem Sohn: O Licht meiner Augen, du wirst nichts ernten als das, was du gesät hast."
"Ah, make the most of what we yet may spend, before we too into the Dust descend." = "Ach, nutzt, was uns noch zu verbrauchen bleibt, bevor auch wir hinab in den Staub sinken."
"Mighty is he who has knowledge." = "Mächtig ist, wer Wissen hat."
"It is in general the unexplored that attracts us." = "Es ist im Allgemeinen das Unerforschte, das uns anzieht."
"Leave undone whatever you hesitate to do." = "Lass ungetan, was du zu tun zögerst."
"Seek not the paths of the ancients; seek that which the ancients sought." = "Suche nicht die Pfade der Alten; suche, was die Alten suchten."
"Every day is a journey, and the journey itself is home." = "Jeder Tag ist eine Reise, und die Reise selbst ist das Zuhause."
"The old pond: a frog jumps in — the sound of the water." = "Der alte Teich: ein Frosch springt hinein – das Geräusch des Wassers."
"Step by step walk the thousand-mile road." = "Schritt für Schritt geh den Weg von tausend Meilen."
"Think lightly of yourself and deeply of the world." = "Denke gering von dir selbst und tief über die Welt."
"Let us dream of evanescence, and linger in the beautiful foolishness of things." = "Lasst uns von der Vergänglichkeit träumen und in der schönen Torheit der Dinge verweilen."
"Fall down seven times, get up eight." = "Siebenmal hinfallen, achtmal aufstehen."
"Even monkeys fall from trees." = "Auch Affen fallen von Bäumen."
"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge." = "Ihr wurdet nicht geschaffen, um wie die Tiere zu leben, sondern um Tugend und Erkenntnis zu erstreben."
"This above all: to thine own self be true." = "Dies über alles: sei dir selbst getreu."
"There is nothing either good or bad, but thinking makes it so." = "An sich ist nichts weder gut noch böse; das Denken macht es erst dazu."
"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt." = "Unsere Zweifel sind Verräter und lassen uns das Gute verlieren, das wir oft gewinnen könnten, weil wir den Versuch scheuen."
"Diligence is the mother of good fortune." = "Fleiß ist die Mutter des Glücks."
"Tell me what company thou keepest, and I'll tell thee what thou art." = "Sag mir, mit wem du umgehst, und ich sage dir, wer du bist."
"The greatest thing in the world is to know how to belong to oneself." = "Das Größte auf der Welt ist, zu wissen, wie man sich selbst gehört."
"Reading maketh a full man; conference a ready man; and writing an exact man." = "Lesen macht einen vollen Menschen, Gespräch einen gewandten und Schreiben einen genauen."
"If I have seen further it is by standing on the shoulders of Giants." = "Wenn ich weiter gesehen habe, dann deshalb, weil ich auf den Schultern von Riesen stand."
"I would have written a shorter letter, but I did not have the time." = "Ich hätte einen kürzeren Brief geschrieben, aber ich hatte keine Zeit."
"Well done is better than well said." = "Gut getan ist besser als gut gesagt."
"Let us cultivate our garden." = "Lasst uns unseren Garten bestellen."
"Great works are performed not by strength, but perseverance." = "Große Werke werden nicht durch Kraft, sondern durch Beharrlichkeit vollbracht."
"To err is human, to forgive divine." = "Irren ist menschlich, Vergeben göttlich."
"A talent is formed in stillness, a character in the world's torrent." = "Es bildet ein Talent sich in der Stille, sich ein Charakter in dem Strom der Welt."
"It is not enough to know, we must also apply; it is not enough to will, we must also do." = "Es ist nicht genug zu wissen, man muss auch anwenden; es ist nicht genug zu wollen, man muss auch tun."
"I do not wish them to have power over men; but over themselves." = "Ich wünsche nicht, dass sie Macht über die Männer haben, sondern über sich selbst."
"One half of the world cannot understand the pleasures of the other." = "Die eine Hälfte der Welt kann die Freuden der anderen nicht verstehen."
"Nothing is so painful to the human mind as a great and sudden change." = "Nichts ist für den menschlichen Geist so schmerzlich wie eine große und plötzliche Veränderung."
"I am no bird; and no net ensnares me; I am a free human being with an independent will." = "Ich bin kein Vogel, und kein Netz hält mich gefangen; ich bin ein freier Mensch mit einem unabhängigen Willen."
"Nothing great was ever achieved without enthusiasm." = "Nichts Großes wurde je ohne Begeisterung erreicht."
"Write it on your heart that every day is the best day in the year." = "Schreib es dir ins Herz, dass jeder Tag der beste Tag des Jahres ist."
"Simplify, simplify." = "Vereinfache, vereinfache."
"Rather than love, than money, than fame, give me truth." = "Lieber als Liebe, als Geld, als Ruhm gib mir Wahrheit."
"A man who dares to waste one hour of time has not discovered the value of life." = "Ein Mensch, der es wagt, eine Stunde Zeit zu verschwenden, hat den Wert des Lebens nicht erkannt."
"The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves." = "Die Analytische Maschine webt algebraische Muster, so wie der Jacquard-Webstuhl Blumen und Blätter webt."
"Everything comes in time to him who knows how to wait." = "Alles kommt zur rechten Zeit für den, der zu warten versteht."
"What do we live for, if it is not to make life less difficult to each other?" = "Wofür leben wir, wenn nicht dafür, einander das Leben weniger schwer zu machen?"
"To live is so startling, it leaves but little room for other occupations." = "Zu leben ist so überwältigend, dass es nur wenig Raum für andere Beschäftigungen lässt."
"I'm not afraid of storms, for I'm learning how to sail my ship." = "Ich habe keine Angst vor Stürmen, denn ich lerne, mein Schiff zu segeln."
"Begin at the beginning, and go on till you come to the end: then stop." = "Fang am Anfang an und mach weiter, bis du ans Ende kommst: dann hör auf."
"No one is useless in this world who lightens the burden of it for any one else." = "Niemand ist nutzlos auf dieser Welt, der einem anderen die Last erleichtert."
"Courage is resistance to fear, mastery of fear—not absence of fear." = "Mut ist Widerstand gegen die Angst, Beherrschung der Angst – nicht Abwesenheit von Angst."
"When in doubt, tell the truth." = "Im Zweifel sag die Wahrheit."
"Brevity is the sister of talent." = "Kürze ist die Schwester des Talents."
"One never notices what has been done; one can only see what remains to be done." = "Man bemerkt nie, was schon getan wurde; man sieht nur, was noch zu tun bleibt."
"We must have perseverance and above all confidence in ourselves." = "Wir müssen Ausdauer haben und vor allem Vertrauen in uns selbst."
"Optimism is the faith that leads to achievement; nothing can be done without hope." = "Optimismus ist der Glaube, der zum Erfolg führt; ohne Hoffnung kann nichts getan werden."
"Although the world is full of suffering, it is full also of the overcoming of it." = "Obwohl die Welt voller Leid ist, ist sie auch voll von seiner Überwindung."
"Life is like riding a bicycle. To keep your balance you must keep moving." = "Das Leben ist wie Fahrradfahren. Um die Balance zu halten, musst du in Bewegung bleiben."
"Imagination is more important than knowledge." = "Fantasie ist wichtiger als Wissen."
"No need to hurry. No need to sparkle. No need to be anybody but oneself." = "Keine Eile. Kein Glanz nötig. Man muss niemand anderes sein als man selbst."
"Attention is the rarest and purest form of generosity." = "Aufmerksamkeit ist die seltenste und reinste Form der Großzügigkeit."
"Think of all the beauty still left around you and be happy." = "Denk an all das Schöne, das noch um dich herum ist, und sei glücklich."
"It is only with the heart that one can see rightly; what is essential is invisible to the eye." = "Man sieht nur mit dem Herzen gut. Das Wesentliche ist für die Augen unsichtbar."
"The first principle is that you must not fool yourself, and you are the easiest person to fool." = "Der erste Grundsatz ist, dass du dich nicht selbst täuschen darfst – und du bist die Person, die am leichtesten zu täuschen ist."
"You can't use up creativity. The more you use, the more you have." = "Kreativität kann man nicht aufbrauchen. Je mehr du sie nutzt, desto mehr hast du."
"Proverbs are the palm-oil with which words are eaten." = "Sprichwörter sind das Palmöl, mit dem man Worte isst."
"The world is like a Mask dancing. If you want to see it well, you do not stand in one place." = "Die Welt ist wie eine tanzende Maske. Wenn du sie gut sehen willst, bleibst du nicht an einer Stelle stehen."
"When there is a big tree small ones climb on its back to reach the sun." = "Wo ein großer Baum steht, klettern die kleinen auf seinen Rücken, um die Sonne zu erreichen."
"I learned that courage was not the absence of fear, but the triumph over it." = "Ich habe gelernt, dass Mut nicht die Abwesenheit von Angst ist, sondern der Sieg über sie."
"A good head and a good heart are always a formidable combination." = "Ein kluger Kopf und ein gutes Herz sind immer eine unschlagbare Verbindung."
"It is in the character of growth that we should learn from both pleasant and unpleasant experiences." = "Es liegt im Wesen des Wachsens, dass wir aus angenehmen wie aus unangenehmen Erfahrungen lernen."
"Love is so powerful, it's like unseen flowers under your feet as you walk." = "Liebe ist so mächtig, sie ist wie unsichtbare Blumen unter deinen Füßen, wenn du gehst."
"Life is not in bits and pieces. It is a magnificent, rhythmic, pulsating symphony." = "Das Leben besteht nicht aus Stücken und Fetzen. Es ist eine großartige, rhythmische, pulsierende Sinfonie."
"Hurry, hurry has no blessings." = "Eile, Eile bringt keinen Segen."
"The sages were not ashamed to find themselves convinced; for they knew, being wise, that their knowledge was not infinite." = "Die Weisen schämten sich nicht, sich überzeugt zu sehen; denn sie wussten, weise wie sie waren, dass ihr Wissen nicht unendlich war."
"To beautify life is to give it an object." = "Das Leben verschönern heißt, ihm einen Zweck geben."
"A grain of poetry suffices to season a century." = "Ein Körnchen Poesie genügt, um ein Jahrhundert zu würzen."
"Little feet of children, two tiny suffering jewels, how can people pass and not see you!" = "Kinderfüßchen, zwei kleine leidende Juwelen, wie können die Leute vorbeigehen und euch nicht sehen!"
"Writing is nothing more than a guided dream." = "Schreiben ist nichts anderes als ein gelenkter Traum."
"Feet, what do I need them for if I have wings to fly." = "Füße, wozu brauche ich euch, wenn ich Flügel zum Fliegen habe?"
"I am not sick. I am broken. But I am happy to be alive as long as I can paint." = "Ich bin nicht krank. Ich bin zerbrochen. Aber ich bin glücklich, am Leben zu sein, solange ich malen kann."
"I must live little by little, it's no good living everything at once." = "Ich muss nach und nach leben, es taugt nichts, alles auf einmal zu leben."
"Life is not what one lived, but what one remembers and how one remembers it in order to recount it." = "Das Leben ist nicht das, was man gelebt hat, sondern das, woran man sich erinnert und wie man sich daran erinnert, um davon zu erzählen."
"Fear is inevitable, I have to accept that, but I cannot allow it to paralyze me." = "Angst ist unvermeidlich, das muss ich akzeptieren, aber ich darf nicht zulassen, dass sie mich lähmt."

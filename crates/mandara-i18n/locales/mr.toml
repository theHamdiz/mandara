"River {version} runs window management in a separate program and no longer has the river-control and river-status protocols, so Mandara can't show or switch its tags, send its binds or follow its windows. Mandara works with River's classic line (0.3, packaged as river-classic)." = "River {version} खिडक्यांचे व्यवस्थापन वेगळ्या प्रोग्राममध्ये करतो आणि त्यात river-control आणि river-status प्रोटोकॉल राहिलेले नाहीत. त्यामुळे Mandara त्याचे टॅग दाखवू किंवा बदलू शकत नाही, त्याचे शॉर्टकट पाठवू शकत नाही किंवा खिडक्यांचा मागोवा घेऊ शकत नाही. Mandara River च्या पारंपरिक शाखेसह चालतो (0.3, river-classic नावाचे पॅकेज)."
"River's config is your init program, which Mandara never edits: Mandara sends River its colours, rules, input settings and keys when the shell starts and on every change. To start Mandara with River, add this line to your init: {line}" = "River ची संरचना तुमचा init प्रोग्राम आहे, जो Mandara कधीही बदलत नाही: shell सुरू होताना आणि प्रत्येक बदलानंतर Mandara रंग, नियम, इनपुट सेटिंग्ज आणि कळा River कडे पाठवतो. River सोबत Mandara सुरू करण्यासाठी init मध्ये ही ओळ जोडा: {line}"

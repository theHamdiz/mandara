"Family and kin" = "कुटुंब आणि नाते"
"All topics" = "सर्व विषय"
"{author}, {work}" = "{author}, {work}"
"A man does not attain everything that he desires; the winds convey whither the ships do not list." = "माणूस इच्छित सर्व मिळवत नाही; वारे जहाजे नको तिथे नेतात."
"A charger's saddle is an exalted throne, the best companions are books alone." = "घोड्याचा खोगीर उंच सिंहासन आहे, सर्वोत्तम साथीदार फक्त पुस्तके आहेत."
"If you venture in pursuit of glory, don't be satisfied with less than the stars." = "कीर्तीच्या शोधात निघाल्यास, ताऱ्यांपेक्षा कमीवर समाधान मानू नका."
"The past resembles the future more than water resembles water." = "भूतकाळ भविष्यासारखा आहे, पाणी पाण्यासारखे असण्यापेक्षा जास्त."
"Skills are acquired only through the repetition of actions." = "कौशल्ये फक्त कृतींच्या पुनरावृत्तीने मिळतात."
"The knowledge of anything, since all things have causes, is not acquired or complete unless it is known by its causes." = "प्रत्येक गोष्टीला कारण असल्याने, तिचे ज्ञान कारणांनी जाणल्याशिवाय मिळत नाही किंवा पूर्ण होत नाही."
"The less reason someone has, the more he fancies himself the most rational and most discerning of all." = "एखाद्याकडे जितकी कमी बुद्धी, तितका तो स्वतःला सर्वात तर्कशुद्ध आणि सूक्ष्म समजतो."
"Friendship is always a sweet responsibility, never an opportunity." = "मैत्री नेहमी गोड जबाबदारी असते, संधी कधीही नाही."
"A sense of humour is a sense of proportion." = "विनोदबुद्धी म्हणजे प्रमाणाची जाणीव."
"If you sing of beauty though alone in the heart of the desert you will have an audience." = "वाळवंटाच्या हृदयात एकटे असूनही सौंदर्याचे गाणे गायल्यास श्रोते मिळतील."
"Work is love made visible." = "काम म्हणजे दिसणारे प्रेम."
"You give but little when you give of your possessions. It is when you give of yourself that you truly give." = "संपत्तीतून दिल्यास आपण थोडेच देता. स्वतःहून दिल्यावरच खरे दान होते."
"Patience is man's refuge in times of despair, and his armor against misfortunes." = "निराशेच्या काळात धीर माणसाचा आश्रय आहे, आणि दुर्दैवाविरुद्ध त्याचे कवच."
"Knowledge is like water and air: it is every citizen's right to enjoy it for free." = "ज्ञान पाणी आणि हवेसारखे आहे: ते मोफत उपभोगणे प्रत्येक नागरिकाचा हक्क आहे."
"Time is like a sword; if you don't cut it, it'll cut you." = "वेळ तलवारीसारखी आहे; आपण ती कापली नाही तर ती आपल्याला कापते."
"All men by nature desire to know." = "सर्व माणसे स्वभावाने जाणू इच्छितात."
"For the things we have to learn before we can do, we learn by doing." = "करण्यापूर्वी शिकाव्या लागणाऱ्या गोष्टी आपण करून शिकतो."
"The roots of education are bitter, but the fruit is sweet." = "शिक्षणाची मुळे कडू आहेत, पण फळ गोड आहे."
"The beginning is the most important part of any work." = "सुरुवात कोणत्याही कामाचा सर्वात महत्त्वाचा भाग आहे."
"You could not step twice into the same river." = "एकाच नदीत दोनदा उतरता येत नाही."
"While we are postponing, life speeds by." = "आपण पुढे ढकलत असताना, जीवन वेगाने जाते."
"We suffer more often in imagination than in reality." = "आपण वास्तवापेक्षा कल्पनेत जास्त दुःख भोगतो."
"It is not that we have a short space of time, but that we waste much of it." = "आपल्याकडे कमी वेळ आहे असे नाही, तर आपण त्याचा बराच भाग वाया घालवतो."
"He who receives a benefit with gratitude, repays the first installment of it." = "कृतज्ञतेने उपकार स्वीकारणारा त्याचा पहिला हप्ता फेडतो."
"Fire tries gold, misfortune tries brave men." = "आग सोन्याची परीक्षा घेते, दुर्दैव शूर माणसांची."
"No longer talk at all about the kind of man that a good man ought to be, but be such." = "चांगला माणूस कसा असावा याबद्दल आता बोलू नका, तसे व्हा."
"Very little indeed is necessary for living a happy life." = "सुखी जीवन जगण्यासाठी खरोखर फार थोडे हवे."
"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig." = "आत पहा. आत चांगल्याचा झरा आहे, आणि आपण खोदत राहिल्यास तो नेहमी उसळेल."
"If it is not right, do not do it: if it is not true, do not say it." = "योग्य नसेल तर करू नका: खरे नसेल तर सांगू नका."
"Confine thyself to the present." = "स्वतःला वर्तमानापुरते मर्यादित करा."
"First say to yourself what you would be; and then do what you have to do." = "आधी स्वतःला सांगा आपण काय व्हाल; मग जे करायचे ते करा."
"No thing great is created suddenly, any more than a bunch of grapes or a fig." = "द्राक्षांचा घोस किंवा अंजीर जसे अचानक तयार होत नाही, तसे कोणतीही मोठी गोष्ट अचानक तयार होत नाही."
"Men are disturbed not by things, but by the views which they take of things." = "माणसांना गोष्टी त्रास देत नाहीत, तर त्या गोष्टींबद्दलचे त्यांचे दृष्टिकोन."
"He who has begun has half done. Dare to be wise; begin!" = "ज्याने सुरुवात केली त्याने अर्धे केले. शहाणे होण्याचे धाडस करा; सुरू करा!"
"Practice is the best of all instructors." = "सराव हा सर्वोत्तम शिक्षक आहे."
"Anyone can hold the helm when the sea is calm." = "समुद्र शांत असताना कोणीही सुकाणू धरू शकतो."
"They can because they think they can." = "ते करू शकतात कारण ते करू शकतात असे त्यांना वाटते."
"If you have a garden and a library, you have everything you need." = "बाग आणि ग्रंथालय असल्यास, हवे ते सर्व आहे."
"Drops of water hollow out a stone." = "पाण्याचे थेंब दगड पोखरतात."
"Slow and steady wins the race." = "हळू आणि स्थिर शर्यत जिंकतो."
"Is it not pleasant to learn with a constant perseverance and application?" = "सतत चिकाटीने आणि अभ्यासानं शिकणे आनंददायी नाही का?"
"If a man keeps cherishing his old knowledge, so as continually to be acquiring new, he may be a teacher of others." = "जुने ज्ञान जपत सतत नवीन मिळवणारा इतरांचा शिक्षक होऊ शकतो."
"Learning without thought is labour lost; thought without learning is perilous." = "विचाराशिवाय शिकणे वाया गेलेले कष्ट; शिकण्याशिवाय विचार धोकादायक."
"When I walk along with two others, they may serve me as my teachers." = "दोघांसोबत चालताना ते मला शिक्षक होऊ शकतात."
"When the year becomes cold, then we know how the pine and the cypress are the last to lose their leaves." = "वर्ष थंड झाल्यावर कळते की पाइन आणि सायप्रस शेवटी पाने गळवतात."
"Do not be desirous to have things done quickly; do not look at small advantages." = "गोष्टी लवकर व्हाव्यात अशी इच्छा करू नका; छोट्या फायद्यांकडे पाहू नका."
"What you do not want done to yourself, do not do to others." = "स्वतःला नको ते इतरांना करू नका."
"The journey of a thousand li commenced with a single step." = "हजार लीचा प्रवास एका पावलाने सुरू होतो."
"He who knows other men is discerning; he who knows himself is intelligent." = "इतरांना ओळखणारा सूक्ष्म; स्वतःला ओळखणारा शहाणा."
"He who overcomes others is strong; he who overcomes himself is mighty." = "इतरांना जिंकणारा बलवान; स्वतःला जिंकणारा पराक्रमी."
"The soft overcomes the hard; and the weak the strong." = "मऊ कडकाला जिंकते; आणि कमकुवत बलवानाला."
"The great man is the one who does not lose his child's heart." = "महान माणूस तो आहे जो आपले बालहृदय गमावत नाही."
"You cannot speak of ocean to a well-frog." = "विहिरीतील बेडकाशी समुद्राबद्दल बोलता येत नाही."
"If you know the enemy and know yourself, you need not fear the result of a hundred battles." = "शत्रू आणि स्वतःला ओळखल्यास शंभर लढायांच्या निकालाची भीती नको."
"Let right deeds be thy motive, not the fruit which comes from them." = "योग्य कृत्ये हेतू असू द्या, त्यांचे फळ नाही."
"Hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule." = "द्वेष कधीही द्वेषाने थांबत नाही: द्वेष प्रेमाने थांबतो, हा जुना नियम आहे."
"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise." = "घन खडक वारा हलवत नाही तसे शहाणे निंदा आणि स्तुतीत डगमगत नाहीत."
"Real kindness seeks no return; what return can the world make to rain clouds?" = "खरी दया परतफेडीची अपेक्षा करत नाही; जग पावसाच्या ढगांना काय परत देऊ शकते?"
"To use bitter words, when kind words are at hand, is like picking unripe fruit when the ripe fruit is there." = "दयाळू शब्द हाताशी असताना कडू शब्द वापरणे म्हणजे पिकलेले फळ असताना कच्चे तोडणे."
"If you shed tears when you miss the sun, you also miss the stars." = "सूर्याची उणीव वाटून अश्रू ढाळल्यास तारेही चुकतात."
"We come nearest to the great when we are great in humility." = "नम्रतेत महान असल्यास आपण महानांच्या सर्वात जवळ येतो."
"If you shut your door to all errors truth will be shut out." = "सर्व चुकांना दार बंद केल्यास सत्यही बाहेर राहते."
"The roots below the earth claim no rewards for making the branches fruitful." = "जमिनीखालील मुळे फांद्या फलदायी केल्याबद्दल बक्षीस मागत नाहीत."
"He who is too busy doing good finds no time to be good." = "चांगले करण्यात खूप व्यस्त असणारा चांगला होण्यासाठी वेळ मिळवत नाही."
"Let your life lightly dance on the edges of Time like dew on the tip of a leaf." = "पानाच्या टोकावरील दव सारखे आपले जीवन वेळेच्या कडांवर हलके नाचू द्या."
"If you are irritated by every rub, how will your mirror be polished?" = "प्रत्येक घासण्याने त्रास झाल्यास आरसा कसा चमकेल?"
"If you are wholly perplexed and in straits, have patience, for patience is the key to joy." = "पूर्ण गोंधळात आणि अडचणीत असल्यास धीर धरा, कारण धीर आनंदाची किल्ली आहे."
"Come, seek, for search is the foundation of fortune: every success depends upon focusing the heart." = "या, शोधा, कारण शोध हा भाग्याचा पाया आहे: प्रत्येक यश हृदयाच्या एकाग्रतेवर अवलंबून आहे."
"If thou covetest riches, ask not but for contentment, which is an immense treasure." = "संपत्ती हवी असल्यास समाधान शिवाय काही मागू नका, ते अफाट खजिना आहे."
"Use a sweet tongue, courtesy, and gentleness, and thou mayst manage to guide an elephant with a hair." = "गोड जीभ, सौजन्य आणि सौम्यता वापरा, आणि केसावर हत्ती नेता येईल."
"Were the diver to think on the jaws of the shark, he would never lay hands on the precious pearl." = "गोताखोराने शार्कच्या जबड्याचा विचार केल्यास तो मौल्यवान मोती कधी हाती घेत नाही."
"How well said the aged farmer to his son, O light of my eyes, thou wilt not reap save that which thou hast sown." = "वयोवृद्ध शेतकऱ्याने मुलाला किती छान सांगितले, माझ्या डोळ्यांच्या प्रकाशा, पेरलेल्याशिवाय कापणी नाही."
"Ah, make the most of what we yet may spend, before we too into the Dust descend." = "अहो, आपणही धुळीत उतरण्यापूर्वी जे अजून खर्च करता येईल त्याचा पुरेपूर उपयोग करा."
"Mighty is he who has knowledge." = "ज्ञान असणारा पराक्रमी आहे."
"It is in general the unexplored that attracts us." = "सर्वसाधारणपणे अन्वेषित न केलेले आपल्याला आकर्षित करते."
"Leave undone whatever you hesitate to do." = "ज्याबद्दल संकोच वाटतो ते न केलेले सोडा."
"Seek not the paths of the ancients; seek that which the ancients sought." = "पुरातन लोकांचे मार्ग शोधू नका; ते जे शोधत होते ते शोधा."
"Every day is a journey, and the journey itself is home." = "प्रत्येक दिवस प्रवास आहे, आणि प्रवास स्वतः घर आहे."
"The old pond: a frog jumps in — the sound of the water." = "जुना तलाव: बेडूक उडी मारतो — पाण्याचा आवाज."
"Step by step walk the thousand-mile road." = "पावलापावलाने हजार मैलांचा रस्ता चला."
"Think lightly of yourself and deeply of the world." = "स्वतःबद्दल हलके आणि जगाबद्दल खोल विचार करा."
"Let us dream of evanescence, and linger in the beautiful foolishness of things." = "क्षणभंगुरतेचे स्वप्न पाहू, आणि गोष्टींच्या सुंदर मूर्खपणात रेंगाळू."
"Fall down seven times, get up eight." = "सात वेळा पडा, आठ वेळा उठा."
"Even monkeys fall from trees." = "माकडेही झाडांवरून पडतात."
"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge." = "पशूंसारखे जगण्यासाठी तुम्ही बनवले नाही, तर सद्गुण आणि ज्ञानाच्या शोधासाठी."
"This above all: to thine own self be true." = "सर्वांवर हे: स्वतःशी प्रामाणिक राहा."
"There is nothing either good or bad, but thinking makes it so." = "स्वतःहून काही चांगले किंवा वाईट नाही; विचार तसे बनवतो."
"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt." = "आपले संशय विश्वासघातकी आहेत, आणि प्रयत्नाची भीतीमुळे आपण अनेकदा जिंकू शकलेले चांगले गमावतो."
"Diligence is the mother of good fortune." = "मेहनत भाग्याची माता आहे."
"Tell me what company thou keepest, and I'll tell thee what thou art." = "कोणत्या संगतीत आहात ते सांगा, आणि मी सांगेन आपण कोण आहात."
"The greatest thing in the world is to know how to belong to oneself." = "जगातील सर्वात मोठी गोष्ट स्वतःचे कसे राहायचे हे जाणणे आहे."
"Reading maketh a full man; conference a ready man; and writing an exact man." = "वाचन पूर्ण माणूस बनवते; संवाद तयार; आणि लेखन अचूक."
"If I have seen further it is by standing on the shoulders of Giants." = "मी पुढे पाहिले असेल तर महापुरुषांच्या खांद्यांवर उभे राहून."
"I would have written a shorter letter, but I did not have the time." = "मी छोटे पत्र लिहिले असते, पण वेळ नव्हता."
"Well done is better than well said." = "चांगले केलेले चांगले बोललेल्यापेक्षा बरे."
"Let us cultivate our garden." = "आपली बाग जोपासू."
"Great works are performed not by strength, but perseverance." = "मोठी कामे शक्तीने नाही, चिकाटीने होतात."
"To err is human, to forgive divine." = "चूकणे मानवी, क्षमा करणे दैवी."
"A talent is formed in stillness, a character in the world's torrent." = "प्रतिभा शांततेत घडते, चारित्र्य जगाच्या प्रवाहात."
"It is not enough to know, we must also apply; it is not enough to will, we must also do." = "जाणणे पुरेसे नाही, लागूही करावे; इच्छा पुरेशी नाही, करावेही."
"I do not wish them to have power over men; but over themselves." = "त्यांना पुरुषांवर सत्ता नको; स्वतःवर हवी."
"One half of the world cannot understand the pleasures of the other." = "जगाचा एक अर्धा दुसऱ्या अर्ध्याचे आनंद समजू शकत नाही."
"Nothing is so painful to the human mind as a great and sudden change." = "मानवी मनाला मोठा आणि अचानक बदल इतका दुःखदायक नाही."
"I am no bird; and no net ensnares me; I am a free human being with an independent will." = "मी पक्षी नाही; आणि कोणतेही जाळे मला अडकवत नाही; मी स्वतंत्र इच्छेचा मुक्त माणूस आहे."
"Nothing great was ever achieved without enthusiasm." = "उत्साहाशिवाय काहीही महान साधले गेले नाही."
"Write it on your heart that every day is the best day in the year." = "हृदयावर लिहा की प्रत्येक दिवस वर्षातील सर्वोत्तम दिवस आहे."
"Simplify, simplify." = "सोपे करा, सोपे करा."
"Rather than love, than money, than fame, give me truth." = "प्रेमापेक्षा, पैशापेक्षा, कीर्तीपेक्षा, मला सत्य द्या."
"A man who dares to waste one hour of time has not discovered the value of life." = "एक तास वेळ वाया घालवण्याचे धाडस करणारा जीवनाचे मूल्य ओळखलेला नाही."
"The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves." = "Analytical Engine बीजगणितीय नमुने विणते जसे Jacquard-लूम फुले आणि पाने विणते."
"Everything comes in time to him who knows how to wait." = "वाट पाहणे येणाऱ्याला सर्व वेळेवर येते."
"What do we live for, if it is not to make life less difficult to each other?" = "एकमेकांचे जीवन कमी कठीण करण्यासाठी नाही तर आपण कशासाठी जगतो?"
"To live is so startling, it leaves but little room for other occupations." = "जगणे इतके चकित करणारे आहे की इतर कामांसाठी थोडीच जागा राहते."
"I'm not afraid of storms, for I'm learning how to sail my ship." = "वादळांची भीती नाही, कारण मी माझे जहाज कसे नेवायचे शिकत आहे."
"Begin at the beginning, and go on till you come to the end: then stop." = "सुरुवातीपासून सुरू करा, आणि शेवट येईपर्यंत जा: मग थांबा."
"No one is useless in this world who lightens the burden of it for any one else." = "दुसऱ्याचे ओझे हलके करणारा या जगात निरुपयोगी नाही."
"Courage is resistance to fear, mastery of fear—not absence of fear." = "धैर्य म्हणजे भीतीला विरोध, भीतीवर प्रभुत्व—भीतीची अनुपस्थिती नाही."
"When in doubt, tell the truth." = "शंका असल्यास सत्य सांगा."
"Brevity is the sister of talent." = "संक्षिप्तता प्रतिभेची बहीण आहे."
"One never notices what has been done; one can only see what remains to be done." = "झालेले कधी दिसत नाही; फक्त करायचे उरलेले दिसते."
"We must have perseverance and above all confidence in ourselves." = "चिकाटी हवी आणि सर्वांवर स्वतःवर विश्वास."
"Optimism is the faith that leads to achievement; nothing can be done without hope." = "आशावाद यशाकडे नेणारी श्रद्धा आहे; आशेशिवाय काही होत नाही."
"Although the world is full of suffering, it is full also of the overcoming of it." = "जग दुःखाने भरलेले असले तरी त्यावर मात करण्यानेही भरलेले आहे."
"Life is like riding a bicycle. To keep your balance you must keep moving." = "जीवन सायकल चालवण्यासारखे आहे. समतोल ठेवण्यासाठी हलते राहावे."
"Imagination is more important than knowledge." = "कल्पना ज्ञानापेक्षा महत्त्वाची आहे."
"No need to hurry. No need to sparkle. No need to be anybody but oneself." = "घाई नको. चमक नको. स्वतःशिवाय कोणी व्हायची गरज नाही."
"Attention is the rarest and purest form of generosity." = "लक्ष हे उदारतेचे दुर्मिळ आणि शुद्ध रूप आहे."
"Think of all the beauty still left around you and be happy." = "भोवती उरलेल्या सर्व सौंदर्याचा विचार करा आणि सुखी व्हा."
"It is only with the heart that one can see rightly; what is essential is invisible to the eye." = "फक्त हृदयाने योग्य पाहता येते; आवश्यक डोळ्यांना अदृश्य आहे."
"The first principle is that you must not fool yourself, and you are the easiest person to fool." = "पहिला नियम: स्वतःची फसवणूक करू नका, आणि फसवणे सर्वात सोपे आपणच आहात."
"You can't use up creativity. The more you use, the more you have." = "सर्जनशीलता संपत नाही. जितकी वापराल तितकी वाढते."
"Proverbs are the palm-oil with which words are eaten." = "म्हणी ते पामतेल आहेत ज्याने शब्द खाल्ले जातात."
"The world is like a Mask dancing. If you want to see it well, you do not stand in one place." = "जग नाचणाऱ्या मुखवट्यासारखे आहे. चांगले पहायचे असल्यास एका जागी उभे राहू नका."
"When there is a big tree small ones climb on its back to reach the sun." = "मोठे झाड असताना लहाने सूर्यापर्यंत पोहोचण्यासाठी त्याच्या पाठीवर चढतात."
"I learned that courage was not the absence of fear, but the triumph over it." = "मी शिकलो की धैर्य भीतीची अनुपस्थिती नाही, तर तिच्यावरील विजय आहे."
"A good head and a good heart are always a formidable combination." = "चांगले डोके आणि चांगले हृदय नेहमी प्रबळ जोडी आहे."
"It is in the character of growth that we should learn from both pleasant and unpleasant experiences." = "वाढीच्या स्वभावात सुखद आणि अप्रिय अनुभवांतून शिकणे आहे."
"Love is so powerful, it's like unseen flowers under your feet as you walk." = "प्रेम इतके बलवान आहे, चालताना पायांखालील अदृश्य फुलांसारखे."
"Life is not in bits and pieces. It is a magnificent, rhythmic, pulsating symphony." = "जीवन तुकड्यांत नाही. ते भव्य, लयबद्ध, स्पंदनशील सिंफनी आहे."
"Hurry, hurry has no blessings." = "घाई, घाईला आशीर्वाद नाही."
"The sages were not ashamed to find themselves convinced; for they knew, being wise, that their knowledge was not infinite." = "शहाण्यांना पटलेले आढळल्याची लाज वाटली नाही; कारण शहाणे असल्याने त्यांचे ज्ञान अनंत नाही हे त्यांना माहीत होते."
"To beautify life is to give it an object." = "जीवन सुंदर करणे म्हणजे त्याला हेतू देणे."
"A grain of poetry suffices to season a century." = "कवितेचा एक कण शतकाला चव देण्यास पुरे."
"Little feet of children, two tiny suffering jewels, how can people pass and not see you!" = "मुलांचे छोटे पाय, दोन लहान दुःखी रत्ने, लोक कसे जातात आणि तुम्हाला पाहत नाहीत!"
"Writing is nothing more than a guided dream." = "लेखन मार्गदर्शित स्वप्नापेक्षा काही नाही."
"Feet, what do I need them for if I have wings to fly." = "पाय, उडण्यासाठी पंख असल्यास तुमची काय गरज."
"I am not sick. I am broken. But I am happy to be alive as long as I can paint." = "मी आजारी नाही. मी तुटले आहे. पण रंगवू शकत असेपर्यंत जगण्यात सुखी आहे."
"I must live little by little, it's no good living everything at once." = "हळूहळू जगावे, सर्व एकदम जगणे चांगले नाही."
"Life is not what one lived, but what one remembers and how one remembers it in order to recount it." = "जीवन जगलेले नाही, तर आठवते ते आणि सांगण्यासाठी ते कसे आठवते."
"Fear is inevitable, I have to accept that, but I cannot allow it to paralyze me." = "भीती अपरिहार्य आहे, ते स्वीकारावे, पण तिला मला ठप्प करू देऊ नये."

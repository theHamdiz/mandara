"Spread salam" = "सलाम पसरवा"
"Stay humble" = "नम्र राहा"
"TODAY'S STEP" = "आजचे पाऊल"
"Take an orphan under your wing and you will be close to the Prophet ﷺ." = "अनाथ मुलाला आपल्या छत्राखाली घ्या आणि आपण पैगंबर ﷺ च्या जवळ असाल."
"Tap the heart on a verse or hadith to keep it here" = "आयत किंवा हदीस येथे ठेवण्यासाठी हृदयावर टॅप करा"
"The Qur'an service sent no verses" = "कुरआन सेवेने आयती पाठवल्या नाहीत"
"The Qur'an's text is the Tanzil Project's Uthmani text, copied exactly." = "कुरआनचा मजकूर Tanzil प्रकल्पाचा उस्मानी मजकूर आहे, तंतोतंत कॉपी केलेला."
"The heart" = "हृदय"
"The meaning couldn't be loaded" = "अर्थ लोड करता आला नाही"
"The meaning in your language under the Arabic; the Qur'an's is downloaded once from Tanzil (api.alquran.cloud). Off: Arabic only" = "अरबीखाली आपल्या भाषेतील अर्थ; कुरआनचा Tanzil (api.alquran.cloud) वरून एकदा डाउनलोड होतो. बंद: फक्त अरबी"
"The paths to Jannah, by group" = "जन्नतकडे जाणारे मार्ग, गटानुसार"
"Their old age is an open door; serve them with love while you can." = "त्यांचे वृद्धत्व उघडे दार आहे; शक्य असताना प्रेमाने सेवा करा."
"Things to avoid" = "टाळायच्या गोष्टी"
"Today's reminder" = "आजची आठवण"
"Today's step" = "आजचे पाऊल"
"Today's step and this week's done days" = "आजचे पाऊल आणि या आठवड्याचे केलेले दिवस"
"Today's step · done" = "आजचे पाऊल · केले"
"Today's verse or hadith and today's step" = "आजची आयत किंवा हदीस आणि आजचे पाऊल"
"Today's verse or hadith in calligraphy under an arch, with its meaning" = "कमानखाली कॅलिग्राफीत आजची आयत किंवा हदीस, अर्थासह"
"Today's verse or hadith in the quote card's style" = "अवतरण कार्डच्या शैलीत आजची आयत किंवा हदीस"
"Trust in your Lord" = "आपल्या प्रभूवर विश्वास ठेवा"
"Try other words or another theme" = "इतर शब्द किंवा दुसरी थीम वापरून पहा"
"Turn back to Him" = "त्याच्याकडे परत या"
"Turn to Him morning and evening with a sincere plea for forgiveness." = "सकाळी आणि संध्याकाळी प्रामाणिक क्षमायाचनेने त्याच्याकडे वळा."
"Unexpected answer from the Qur'an service: {error}" = "कुरआन सेवेकडून अनपेक्षित उत्तर: {error}"
"Verse under an arch" = "कमानखाली आयत"
"Verses and hadith are shown exactly as in their sources. When in doubt, check a reference with a scholar or a printed edition." = "आयती आणि हदीस त्यांच्या स्रोतांप्रमाणे तंतोतंत दाखवल्या जातात. शंका असल्यास विद्वान किंवा छापील आवृत्तीसोबत संदर्भ तपासा."
"Walk gently and think little of yourself; the humble are honoured there." = "हळू चाल आणि स्वतःला लहान समजा; नम्रांचा तिथे सन्मान होतो."
"Walk to the mosque" = "मशिदीकडे चला"
"Wash with care, then pray two rak'ahs with your whole heart." = "काळजीपूर्वक धुवा, मग पूर्ण हृदयाने दोन रकात नमाझ करा."
"What it is like" = "ते कसे आहे"
"What keeps from it" = "त्यापासून काय दूर ठेवते"
"Whatever has happened, sincere repentance opens the way again." = "काहीही घडले असले, प्रामाणिक पश्चात्ताप मार्ग पुन्हा उघडतो."
"Whoever you are responsible for, never deceive or neglect them." = "ज्यांची जबाबदारी आपल्यावर आहे, त्यांची कधी फसवणूक किंवा दुर्लक्ष करू नका."
"With its chain of narrators" = "त्याच्या निवेदकांच्या साखळीसह"
"Worship" = "उपासना"
"Worship Him alone" = "फक्त त्याची उपासना करा"
"Your saved verses and hadith, newest first" = "आपल्या जतन आयती आणि हदीस, नवीनतम आधी"
"a path key from `jannah paths`" = "`jannah paths` मधील मार्ग की"

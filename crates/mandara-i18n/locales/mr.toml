"Seek knowledge" = "ज्ञान शोधा"
"Share your food with the needy and sit a while with the sick." = "गरजूंसोबत जेवण वाटा आणि आजारींसोबत थोडा वेळ बसा."
"Show the meaning" = "अर्थ दाखवा"
"Small" = "लहान"
"Small good deeds, done sincerely and kept up, are the most beloved." = "प्रामाणिकपणे केली आणि टिकवलेली छोटी चांगली कृत्ये सर्वात प्रिय आहेत."

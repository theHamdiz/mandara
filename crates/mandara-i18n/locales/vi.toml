"River's config is your init program, which Mandara never edits: Mandara sends River its colours, rules, input settings and keys when the shell starts and on every change. To start Mandara with River, add this line to your init: {line}" = "Cấu hình River là chương trình init của bạn, Mandara không bao giờ sửa nó: Mandara gửi màu, quy tắc, thiết lập nhập liệu và phím cho River khi shell khởi động và sau mỗi thay đổi. Để chạy Mandara cùng River, thêm dòng này vào init: {line}"

"A man does not attain everything that he desires; the winds convey whither the ships do not list." = "Người ta không đạt được mọi điều mình muốn; gió đưa thuyền tới chỗ nó không nghiêng về."
"A charger's saddle is an exalted throne, the best companions are books alone." = "Yên ngựa chiến là một ngai cao, bạn đồng hành tốt nhất chỉ là sách."
"If you venture in pursuit of glory, don't be satisfied with less than the stars." = "Nếu bạn dấn thân tìm vinh quang, đừng hài lòng với thứ kém hơn những vì sao."
"The past resembles the future more than water resembles water." = "Quá khứ giống tương lai hơn cả nước giống nước."
"Skills are acquired only through the repetition of actions." = "Kỹ năng chỉ có được nhờ lặp lại hành động."
"The knowledge of anything, since all things have causes, is not acquired or complete unless it is known by its causes." = "Tri thức về bất cứ điều gì, vì mọi thứ đều có nguyên nhân, không có được và không trọn nếu không biết nguyên nhân của nó."
"The less reason someone has, the more he fancies himself the most rational and most discerning of all." = "Người càng ít lý trí càng dễ tưởng mình là kẻ lý trí nhất và sáng suốt nhất."
"Friendship is always a sweet responsibility, never an opportunity." = "Tình bạn luôn là một trách nhiệm ngọt ngào, không bao giờ là một cơ hội."
"A sense of humour is a sense of proportion." = "Khiếu hài hước là khiếu chừng mực."
"If you sing of beauty though alone in the heart of the desert you will have an audience." = "Nếu bạn hát về cái đẹp dù một mình giữa sa mạc, bạn vẫn có người nghe."
"Work is love made visible." = "Công việc là tình yêu được làm cho thấy."
"You give but little when you give of your possessions. It is when you give of yourself that you truly give." = "Bạn cho rất ít khi cho của cải. Khi bạn cho chính mình, bạn mới thực sự cho."
"Patience is man's refuge in times of despair, and his armor against misfortunes." = "Kiên nhẫn là chỗ nương của người khi tuyệt vọng, và là áo giáp trước tai họa."
"Knowledge is like water and air: it is every citizen's right to enjoy it for free." = "Tri thức như nước và không khí: mỗi người đều có quyền hưởng nó miễn phí."
"Time is like a sword; if you don't cut it, it'll cut you." = "Thời gian như một thanh kiếm; nếu bạn không cắt nó, nó sẽ cắt bạn."
"All men by nature desire to know." = "Mọi người theo bản tính đều muốn biết."
"For the things we have to learn before we can do, we learn by doing." = "Những việc phải học trước khi làm được, ta học bằng cách làm."
"The roots of education are bitter, but the fruit is sweet." = "Gốc của giáo dục đắng, nhưng quả thì ngọt."
"The beginning is the most important part of any work." = "Khởi đầu là phần quan trọng nhất của mọi việc."
"You could not step twice into the same river." = "Bạn không thể bước hai lần xuống cùng một dòng sông."
"While we are postponing, life speeds by." = "Trong lúc ta hoãn, cuộc sống vụt qua."
"We suffer more often in imagination than in reality." = "Ta khổ trong tưởng tượng nhiều hơn trong thực tại."
"It is not that we have a short space of time, but that we waste much of it." = "Không phải ta có ít thời gian, mà là ta phung phí nhiều."
"He who receives a benefit with gratitude, repays the first installment of it." = "Người nhận ơn bằng lòng biết ơn đã trả kỳ đầu của món nợ ấy."
"Fire tries gold, misfortune tries brave men." = "Lửa thử vàng, hoạn nạn thử người dũng."
"No longer talk at all about the kind of man that a good man ought to be, but be such." = "Đừng nói nữa về kiểu người mà người tốt phải là, hãy là người ấy."
"Very little indeed is necessary for living a happy life." = "Thật ra rất ít thứ là đủ để sống một đời hạnh phúc."
"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig." = "Nhìn vào trong. Trong ấy là mạch của điều tốt, và nó sẽ mãi tuôn nếu bạn cứ đào."
"If it is not right, do not do it: if it is not true, do not say it." = "Nếu không đúng, đừng làm: nếu không thật, đừng nói."
"Confine thyself to the present." = "Hãy ở lại với hiện tại."
"First say to yourself what you would be; and then do what you have to do." = "Trước hết hãy nói với mình bạn muốn là ai; rồi làm điều bạn phải làm."
"No thing great is created suddenly, any more than a bunch of grapes or a fig." = "Không việc lớn nào được tạo ra đột ngột, cũng như một chùm nho hay một quả vả."
"Men are disturbed not by things, but by the views which they take of things." = "Người ta không bị sự việc làm rối, mà bị cách họ nhìn sự việc."
"He who has begun has half done. Dare to be wise; begin!" = "Người đã bắt đầu thì đã làm được một nửa. Hãy dám khôn; hãy bắt đầu!"
"Practice is the best of all instructors." = "Thực hành là người dạy giỏi nhất."
"Anyone can hold the helm when the sea is calm." = "Ai cũng cầm được bánh lái khi biển lặng."
"They can because they think they can." = "Họ làm được vì họ nghĩ mình làm được."
"If you have a garden and a library, you have everything you need." = "Nếu bạn có một khu vườn và một thư viện, bạn đã có mọi thứ cần."
"Drops of water hollow out a stone." = "Những giọt nước cũng khoét được đá."
"Slow and steady wins the race." = "Chậm mà đều thì thắng cuộc."
"Is it not pleasant to learn with a constant perseverance and application?" = "Học với sự bền bỉ và chăm chỉ chẳng phải là vui sao?"
"If a man keeps cherishing his old knowledge, so as continually to be acquiring new, he may be a teacher of others." = "Nếu người cứ trân trọng tri thức cũ để không ngừng có được tri thức mới, người ấy có thể dạy người khác."
"Learning without thought is labour lost; thought without learning is perilous." = "Học mà không nghĩ là công uổng; nghĩ mà không học thì nguy."
"When I walk along with two others, they may serve me as my teachers." = "Khi tôi đi cùng hai người, họ có thể làm thầy tôi."
"When the year becomes cold, then we know how the pine and the cypress are the last to lose their leaves." = "Khi năm trở lạnh, ta mới thấy thông và bách là những cây rụng lá sau cùng."
"Do not be desirous to have things done quickly; do not look at small advantages." = "Đừng ham việc xong cho nhanh; đừng nhìn những lợi nhỏ."
"What you do not want done to yourself, do not do to others." = "Điều bạn không muốn người làm với mình, đừng làm với người."
"The journey of a thousand li commenced with a single step." = "Hành trình ngàn dặm bắt đầu bằng một bước."
"He who knows other men is discerning; he who knows himself is intelligent." = "Người biết người khác là sáng suốt; người biết mình là trí tuệ."
"He who overcomes others is strong; he who overcomes himself is mighty." = "Người thắng người khác là mạnh; người thắng chính mình là lớn."
"The soft overcomes the hard; and the weak the strong." = "Mềm thắng cứng; yếu thắng mạnh."
"The great man is the one who does not lose his child's heart." = "Người lớn là người không mất trái tim trẻ thơ."
"You cannot speak of ocean to a well-frog." = "Không thể nói về biển với ếch ngồi đáy giếng."
"If you know the enemy and know yourself, you need not fear the result of a hundred battles." = "Biết địch và biết mình, bạn không phải sợ kết quả của trăm trận."
"Let right deeds be thy motive, not the fruit which comes from them." = "Hãy để việc đúng là động cơ, không phải quả từ việc ấy."
"Hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule." = "Hận không bao giờ dứt bằng hận: hận dứt bằng yêu, đó là luật cũ."
"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise." = "Như tảng đá không lay vì gió, người khôn không nao giữa lời chê và lời khen."
"Real kindness seeks no return; what return can the world make to rain clouds?" = "Lòng tốt thật không đòi đáp; đời đáp được gì cho mây mưa?"
"To use bitter words, when kind words are at hand, is like picking unripe fruit when the ripe fruit is there." = "Dùng lời đắng khi lời dịu đang sẵn là như hái quả xanh khi quả chín đã có."
"If you shed tears when you miss the sun, you also miss the stars." = "Nếu bạn khóc vì nhớ mặt trời, bạn cũng bỏ lỡ những vì sao."
"We come nearest to the great when we are great in humility." = "Ta gần người lớn nhất khi ta lớn trong sự khiêm."
"If you shut your door to all errors truth will be shut out." = "Nếu bạn đóng cửa với mọi sai lầm, sự thật cũng bị đóng ngoài."
"The roots below the earth claim no rewards for making the branches fruitful." = "Rễ dưới đất không đòi thưởng vì đã làm cành ra quả."
"He who is too busy doing good finds no time to be good." = "Người quá bận làm việc tốt thì không còn giờ để là người tốt."
"Let your life lightly dance on the edges of Time like dew on the tip of a leaf." = "Hãy để đời bạn nhảy nhẹ trên mép Thời gian như sương trên đầu lá."
"If you are irritated by every rub, how will your mirror be polished?" = "Nếu mỗi lần mài đều làm bạn bực, gương của bạn sao được bóng?"
"If you are wholly perplexed and in straits, have patience, for patience is the key to joy." = "Nếu bạn hoàn toàn bối rối và khốn cùng, hãy kiên nhẫn, vì kiên nhẫn là chìa khóa của niềm vui."
"Come, seek, for search is the foundation of fortune: every success depends upon focusing the heart." = "Hãy đến và tìm, vì sự tìm là nền của vận may: mọi thành công nhờ lòng tập trung."
"If thou covetest riches, ask not but for contentment, which is an immense treasure." = "Nếu bạn ham giàu, đừng xin gì ngoài sự bằng lòng, đó là kho báu lớn."
"Use a sweet tongue, courtesy, and gentleness, and thou mayst manage to guide an elephant with a hair." = "Dùng lưỡi ngọt, lễ độ và dịu dàng, bạn có thể dắt voi bằng một sợi tóc."
"Were the diver to think on the jaws of the shark, he would never lay hands on the precious pearl." = "Nếu thợ lặn cứ nghĩ tới hàm cá mập, người ấy sẽ không bao giờ chạm được viên ngọc quý."
"How well said the aged farmer to his son, O light of my eyes, thou wilt not reap save that which thou hast sown." = "Ông nông dân già nói với con hay biết bao: ôi ánh sáng của mắt cha, con sẽ không gặt gì ngoài thứ con đã gieo."
"Ah, make the most of what we yet may spend, before we too into the Dust descend." = "Hãy tận hưởng những gì ta còn có thể tiêu, trước khi ta cũng xuống bụi."
"Mighty is he who has knowledge." = "Mạnh là người có tri thức."
"It is in general the unexplored that attracts us." = "Nói chung, thứ chưa được khám phá mới hút ta."
"Leave undone whatever you hesitate to do." = "Hãy bỏ việc bạn còn do dự."
"Seek not the paths of the ancients; seek that which the ancients sought." = "Đừng tìm đường của người xưa; hãy tìm điều người xưa đã tìm."
"Every day is a journey, and the journey itself is home." = "Mỗi ngày là một hành trình, và chính hành trình là nhà."
"The old pond: a frog jumps in — the sound of the water." = "Ao cũ: một con ếch nhảy vào — tiếng nước."
"Step by step walk the thousand-mile road." = "Từng bước đi con đường ngàn dặm."
"Think lightly of yourself and deeply of the world." = "Nghĩ nhẹ về mình và sâu về đời."
"Let us dream of evanescence, and linger in the beautiful foolishness of things." = "Hãy mơ về sự thoáng qua, và nán lại trong cái ngốc đẹp của mọi thứ."
"Fall down seven times, get up eight." = "Ngã bảy lần, đứng dậy tám."
"Even monkeys fall from trees." = "Cả khỉ cũng ngã từ cây."
"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge." = "Các người không được tạo để sống như thú, mà để theo đuổi đức hạnh và tri thức."
"This above all: to thine own self be true." = "Trên hết: hãy trung thực với chính mình."
"There is nothing either good or bad, but thinking makes it so." = "Không có gì tự nó tốt hay xấu, suy nghĩ làm nó thành vậy."
"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt." = "Nghi ngờ là kẻ phản, khiến ta mất điều tốt ta thường có thể đạt, vì sợ thử."
"Diligence is the mother of good fortune." = "Chăm chỉ là mẹ của vận may."
"Tell me what company thou keepest, and I'll tell thee what thou art." = "Hãy nói bạn chơi với ai, tôi sẽ nói bạn là ai."
"The greatest thing in the world is to know how to belong to oneself." = "Điều lớn nhất trên đời là biết thuộc về chính mình."
"Reading maketh a full man; conference a ready man; and writing an exact man." = "Đọc làm người đầy; bàn làm người sẵn; viết làm người chính xác."
"If I have seen further it is by standing on the shoulders of Giants." = "Nếu tôi nhìn xa hơn, là vì tôi đứng trên vai những người khổng lồ."
"I would have written a shorter letter, but I did not have the time." = "Tôi đã viết một lá thư ngắn hơn, nếu tôi có thời gian."
"Well done is better than well said." = "Làm tốt hơn là nói hay."
"Let us cultivate our garden." = "Hãy vun vườn của chúng ta."
"Great works are performed not by strength, but perseverance." = "Việc lớn được làm không bằng sức mạnh, mà bằng sự bền bỉ."
"To err is human, to forgive divine." = "Sai là người, tha là cao cả."
"A talent is formed in stillness, a character in the world's torrent." = "Tài năng hình thành trong yên tĩnh, phẩm cách trong dòng đời."
"It is not enough to know, we must also apply; it is not enough to will, we must also do." = "Biết là chưa đủ, còn phải dùng; muốn là chưa đủ, còn phải làm."
"I do not wish them to have power over men; but over themselves." = "Tôi không muốn họ có quyền trên người khác; mà trên chính họ."
"One half of the world cannot understand the pleasures of the other." = "Một nửa đời không hiểu được niềm vui của nửa kia."
"Nothing is so painful to the human mind as a great and sudden change." = "Không gì đau tâm trí người bằng một đổi thay lớn và đột ngột."
"I am no bird; and no net ensnares me; I am a free human being with an independent will." = "Tôi không phải chim; không lưới nào bắt được tôi; tôi là người tự do với ý chí riêng."
"Nothing great was ever achieved without enthusiasm." = "Không việc lớn nào được làm mà không có lòng hăng."
"Write it on your heart that every day is the best day in the year." = "Hãy viết vào lòng rằng mỗi ngày là ngày đẹp nhất trong năm."
"Simplify, simplify." = "Đơn giản, rồi đơn giản nữa."
"Rather than love, than money, than fame, give me truth." = "Hơn cả tình yêu, tiền bạc, danh vọng, hãy cho tôi sự thật."
"A man who dares to waste one hour of time has not discovered the value of life." = "Người dám phí một giờ chưa khám phá giá trị của đời."
"The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves." = "Máy phân tích dệt các mẫu đại số như khung cửi Jacquard dệt hoa và lá."
"Everything comes in time to him who knows how to wait." = "Mọi thứ đến đúng lúc với người biết chờ."
"What do we live for, if it is not to make life less difficult to each other?" = "Ta sống để làm gì, nếu không phải để đời bớt khó cho nhau?"
"To live is so startling, it leaves but little room for other occupations." = "Sống đã đủ khiến người giật mình, chẳng còn mấy chỗ cho việc khác."
"I'm not afraid of storms, for I'm learning how to sail my ship." = "Tôi không sợ bão, vì tôi đang học cách lái thuyền của mình."
"Begin at the beginning, and go on till you come to the end: then stop." = "Bắt đầu từ chỗ bắt đầu, đi tiếp đến chỗ kết thúc: rồi dừng."
"No one is useless in this world who lightens the burden of it for any one else." = "Không ai vô dụng trên đời này nếu người ấy làm nhẹ gánh cho một người khác."
"Courage is resistance to fear, mastery of fear—not absence of fear." = "Can đảm là chống lại nỗi sợ, làm chủ nỗi sợ — không phải không có sợ."
"When in doubt, tell the truth." = "Khi phân vân, hãy nói sự thật."
"Brevity is the sister of talent." = "Ngắn gọn là em của tài năng."
"One never notices what has been done; one can only see what remains to be done." = "Người ta không thấy những gì đã làm; chỉ thấy những gì còn phải làm."
"We must have perseverance and above all confidence in ourselves." = "Ta phải bền bỉ, và trên hết là tin ở mình."
"Optimism is the faith that leads to achievement; nothing can be done without hope." = "Lạc quan là đức tin dẫn tới thành tựu; không hy vọng thì không làm được gì."
"Although the world is full of suffering, it is full also of the overcoming of it." = "Dù đời đầy khổ, đời cũng đầy những lần vượt qua khổ ấy."
"Life is like riding a bicycle. To keep your balance you must keep moving." = "Đời như đi xe đạp. Muốn giữ thăng bằng thì phải cứ đi."
"Imagination is more important than knowledge." = "Trí tưởng tượng quan trọng hơn tri thức."
"No need to hurry. No need to sparkle. No need to be anybody but oneself." = "Không cần vội. Không cần lấp lánh. Không cần là ai khác ngoài chính mình."
"Attention is the rarest and purest form of generosity." = "Sự chú ý là hình thức hào phóng hiếm và thuần nhất."
"Think of all the beauty still left around you and be happy." = "Hãy nghĩ tới mọi cái đẹp còn quanh bạn và vui lên."
"It is only with the heart that one can see rightly; what is essential is invisible to the eye." = "Chỉ bằng trái tim người ta mới thấy đúng; điều cốt yếu thì mắt không thấy."
"The first principle is that you must not fool yourself, and you are the easiest person to fool." = "Nguyên tắc đầu là đừng tự lừa mình, và bạn là người dễ tự lừa nhất."
"You can't use up creativity. The more you use, the more you have." = "Bạn không dùng hết sự sáng tạo được. Càng dùng, càng có."
"Proverbs are the palm-oil with which words are eaten." = "Tục ngữ là dầu cọ để ăn lời."
"The world is like a Mask dancing. If you want to see it well, you do not stand in one place." = "Đời như một Mặt nạ đang nhảy. Muốn nhìn rõ, đừng đứng một chỗ."
"When there is a big tree small ones climb on its back to reach the sun." = "Khi có cây lớn, cây nhỏ leo lưng nó để tới mặt trời."
"I learned that courage was not the absence of fear, but the triumph over it." = "Tôi học được rằng can đảm không phải là không sợ, mà là thắng nỗi sợ."
"A good head and a good heart are always a formidable combination." = "Một cái đầu tốt và một trái tim tốt luôn là cặp ghê gớm."
"It is in the character of growth that we should learn from both pleasant and unpleasant experiences." = "Bản chất của sự lớn là ta học từ cả trải nghiệm dễ chịu lẫn khó chịu."
"Love is so powerful, it's like unseen flowers under your feet as you walk." = "Tình yêu mạnh đến mức như những bông hoa không thấy dưới chân khi bạn bước."
"Life is not in bits and pieces. It is a magnificent, rhythmic, pulsating symphony." = "Đời không phải những mảnh vụn. Đời là một bản giao hưởng lộng lẫy, có nhịp, đang đập."
"Hurry, hurry has no blessings." = "Vội vàng thì không có phúc."
"The sages were not ashamed to find themselves convinced; for they knew, being wise, that their knowledge was not infinite." = "Người khôn không xấu hổ khi thấy mình bị thuyết phục; vì họ biết, là người khôn, rằng tri thức của mình không vô hạn."
"To beautify life is to give it an object." = "Làm đời đẹp là cho nó một mục đích."
"A grain of poetry suffices to season a century." = "Một hạt thơ cũng đủ ướp cả một thế kỷ."
"Little feet of children, two tiny suffering jewels, how can people pass and not see you!" = "Đôi chân nhỏ của trẻ, hai viên ngọc khổ đau bé xíu, sao người ta đi qua mà không thấy các con!"
"Writing is nothing more than a guided dream." = "Viết chẳng hơn một giấc mơ được dẫn dắt."
"Feet, what do I need them for if I have wings to fly." = "Chân ơi, tôi cần các ngươi làm gì khi tôi có cánh để bay."
"I am not sick. I am broken. But I am happy to be alive as long as I can paint." = "Tôi không bệnh. Tôi gãy. Nhưng tôi vui vì còn sống chừng nào còn vẽ được."
"I must live little by little, it's no good living everything at once." = "Tôi phải sống từng chút một, sống hết một lúc thì không hay."
"Life is not what one lived, but what one remembers and how one remembers it in order to recount it." = "Đời không phải những gì người ta đã sống, mà là những gì người ta nhớ và cách người ta nhớ để kể lại."
"Fear is inevitable, I have to accept that, but I cannot allow it to paralyze me." = "Sợ là không tránh được, tôi phải nhận điều đó, nhưng tôi không thể để nó làm tôi tê liệt."

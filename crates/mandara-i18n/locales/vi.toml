"Verses and hadith are shown exactly as in their sources. When in doubt, check a reference with a scholar or a printed edition." = "Câu kinh và hadith được hiện đúng như trong nguồn. Khi phân vân, hãy đối chiếu với một học giả hoặc một bản in."
"Walk gently and think little of yourself; the humble are honoured there." = "Bước nhẹ và nghĩ ít về mình; người khiêm được tôn trọng ở đó."

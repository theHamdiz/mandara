"Mandara wrote `{key}`, which {compositor} {version} doesn't support. Regenerating stops Mandara from writing it for this version." = "Mandara ने `{key}` लिखा, जिसे {compositor} {version} समर्थन नहीं करता। फिर से बनाने पर Mandara इस संस्करण के लिए इसे लिखना बंद कर देगा।"

"Editors" = "एडिटर"
"Install, preview and apply cursor themes, live, with size and hiding options" = "कर्सर थीम इंस्टॉल करें, देखें और तुरंत लागू करें, आकार और छिपाने के विकल्पों के साथ"
"Installs them to ~/.local/share/icons" = "उन्हें ~/.local/share/icons में इंस्टॉल करता है"

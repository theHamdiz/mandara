"It's Mandara's {example} example, republished unchanged" = "यह Mandara का {example} उदाहरण है, बिना बदलाव फिर से प्रकाशित"
"Confirm: install anyway" = "पुष्टि करें: फिर भी इंस्टॉल करें"

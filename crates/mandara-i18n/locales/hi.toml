"River {version} runs window management in a separate program and no longer has the river-control and river-status protocols, so Mandara can't show or switch its tags, send its binds or follow its windows. Mandara works with River's classic line (0.3, packaged as river-classic)." = "River {version} विंडो प्रबंधन एक अलग प्रोग्राम में चलाता है और उसमें अब river-control और river-status प्रोटोकॉल नहीं हैं, इसलिए Mandara उसके टैग न दिखा सकता है न बदल सकता है, न शॉर्टकट भेज सकता है, न विंडो देख सकता है। Mandara River की क्लासिक श्रृंखला (0.3, river-classic नाम से पैकेज) के साथ काम करता है।"
"River's config is your init program, which Mandara never edits: Mandara sends River its colours, rules, input settings and keys when the shell starts and on every change. To start Mandara with River, add this line to your init: {line}" = "River का कॉन्फ़िग आपका init प्रोग्राम है, जिसे Mandara कभी नहीं बदलता: शेल शुरू होने पर और हर बदलाव पर Mandara River को अपने रंग, नियम, इनपुट सेटिंग्स और कुंजियाँ भेजता है। River के साथ Mandara शुरू करने के लिए अपने init में यह लाइन जोड़ें: {line}"
"Your River init doesn't start Mandara. Mandara never edits it: add this line to it yourself: {line}" = "आपका River init Mandara शुरू नहीं करता। Mandara इसे कभी नहीं बदलता: यह लाइन स्वयं जोड़ें: {line}"
"Your init maps {chord}, which Mandara binds too: Mandara leaves yours and skips its own." = "आपका init {chord} मैप करता है, जिसे Mandara भी बाँधता है: Mandara आपका रखता है और अपना छोड़ देता है।"

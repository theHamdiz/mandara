"Knowledge is like water and air: it is every citizen's right to enjoy it for free." = "ज्ञान पानी और हवा की तरह है: इसका निःशुल्क उपभोग हर नागरिक का अधिकार है।"
"Time is like a sword; if you don't cut it, it'll cut you." = "समय तलवार की तरह है; अगर तुम उसे नहीं काटोगे, तो वह तुम्हें काट देगा।"
"All men by nature desire to know." = "सभी मनुष्य स्वभाव से जानने की इच्छा रखते हैं।"
"For the things we have to learn before we can do, we learn by doing." = "जिन चीज़ों को करने से पहले हमें सीखना होता है, उन्हें हम करके ही सीखते हैं।"
"The roots of education are bitter, but the fruit is sweet." = "शिक्षा की जड़ें कड़वी होती हैं, पर उसका फल मीठा होता है।"
"The beginning is the most important part of any work." = "किसी भी काम का सबसे महत्वपूर्ण भाग उसका आरंभ है।"
"You could not step twice into the same river." = "तुम एक ही नदी में दो बार पाँव नहीं रख सकते।"
"While we are postponing, life speeds by." = "जब तक हम टालते रहते हैं, जीवन तेज़ी से बीत जाता है।"
"We suffer more often in imagination than in reality." = "हम वास्तविकता से अधिक कल्पना में दुख भोगते हैं।"
"It is not that we have a short space of time, but that we waste much of it." = "ऐसा नहीं है कि हमारे पास समय कम है, बल्कि हम उसका बहुत सारा भाग व्यर्थ गँवा देते हैं।"
"He who receives a benefit with gratitude, repays the first installment of it." = "जो कृतज्ञता के साथ उपकार ग्रहण करता है, वह उसकी पहली किस्त चुका देता है।"
"Fire tries gold, misfortune tries brave men." = "आग सोने को परखती है, विपत्ति वीरों को।"
"No longer talk at all about the kind of man that a good man ought to be, but be such." = "अब यह चर्चा बिल्कुल मत करो कि एक अच्छे मनुष्य को कैसा होना चाहिए, बल्कि वैसे बन जाओ।"
"Very little indeed is necessary for living a happy life." = "सुखी जीवन जीने के लिए सचमुच बहुत थोड़े की आवश्यकता है।"
"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig." = "भीतर देखो। भीतर ही शुभ का स्रोत है, और यदि तुम खोदते रहो, तो वह सदा उमड़ता रहेगा।"
"If it is not right, do not do it: if it is not true, do not say it." = "यदि उचित नहीं है, तो मत करो; यदि सत्य नहीं है, तो मत कहो।"
"Confine thyself to the present." = "स्वयं को वर्तमान तक सीमित रखो।"
"First say to yourself what you would be; and then do what you have to do." = "पहले स्वयं से कहो कि तुम क्या बनना चाहते हो; फिर वह करो जो तुम्हें करना है।"
"No thing great is created suddenly, any more than a bunch of grapes or a fig." = "कोई भी महान वस्तु अचानक नहीं बनती, जैसे अंगूर का गुच्छा या अंजीर भी अचानक नहीं बनता।"
"Men are disturbed not by things, but by the views which they take of things." = "मनुष्य वस्तुओं से नहीं, बल्कि वस्तुओं के बारे में अपने विचारों से विचलित होते हैं।"
"He who has begun has half done. Dare to be wise; begin!" = "जिसने आरंभ कर दिया, उसने आधा काम कर लिया। बुद्धिमान बनने का साहस करो; आरंभ करो!"
"Practice is the best of all instructors." = "अभ्यास सभी शिक्षकों में सर्वश्रेष्ठ है।"
"Anyone can hold the helm when the sea is calm." = "जब समुद्र शांत हो, तब कोई भी पतवार थाम सकता है।"
"They can because they think they can." = "वे कर सकते हैं, क्योंकि वे सोचते हैं कि वे कर सकते हैं।"
"If you have a garden and a library, you have everything you need." = "यदि आपके पास एक बगीचा और एक पुस्तकालय है, तो आपके पास वह सब है जिसकी आपको आवश्यकता है।"
"Drops of water hollow out a stone." = "पानी की बूँदें पत्थर को भी खोखला कर देती हैं।"
"Slow and steady wins the race." = "धीमी और स्थिर चाल दौड़ जीतती है।"
"Is it not pleasant to learn with a constant perseverance and application?" = "क्या निरंतर लगन और परिश्रम के साथ सीखना सुखद नहीं है?"
"If a man keeps cherishing his old knowledge, so as continually to be acquiring new, he may be a teacher of others." = "यदि कोई अपने पुराने ज्ञान को सँजोते हुए निरंतर नया ज्ञान अर्जित करता रहे, तो वह दूसरों का शिक्षक बन सकता है।"
"Learning without thought is labour lost; thought without learning is perilous." = "विचार के बिना सीखना व्यर्थ श्रम है; सीखे बिना विचार करना ख़तरनाक है।"
"When I walk along with two others, they may serve me as my teachers." = "जब मैं दो अन्य लोगों के साथ चलता हूँ, तो वे मेरे शिक्षक बन सकते हैं।"
"When the year becomes cold, then we know how the pine and the cypress are the last to lose their leaves." = "जब वर्ष ठंडा हो जाता है, तभी हम जानते हैं कि चीड़ और सरू सबसे अंत में अपने पत्ते गिराते हैं।"
"Do not be desirous to have things done quickly; do not look at small advantages." = "काम जल्दी होने की इच्छा मत करो; छोटे लाभों की ओर मत देखो।"
"What you do not want done to yourself, do not do to others." = "जो तुम अपने साथ नहीं चाहते, वह दूसरों के साथ मत करो।"
"The journey of a thousand li commenced with a single step." = "हज़ार ली की यात्रा एक क़दम से शुरू होती है।"
"He who knows other men is discerning; he who knows himself is intelligent." = "जो दूसरों को जानता है वह विवेकी है; जो स्वयं को जानता है वह बुद्धिमान है।"
"He who overcomes others is strong; he who overcomes himself is mighty." = "जो दूसरों को जीतता है वह बलवान है; जो स्वयं को जीतता है वह महाबली है।"
"The soft overcomes the hard; and the weak the strong." = "कोमल कठोर पर विजय पाता है, और दुर्बल बलवान पर।"
"The great man is the one who does not lose his child's heart." = "महान मनुष्य वह है जो अपने बालक-हृदय को नहीं खोता।"
"You cannot speak of ocean to a well-frog." = "कुएँ के मेंढक से समुद्र की बात नहीं की जा सकती।"
"If you know the enemy and know yourself, you need not fear the result of a hundred battles." = "यदि तुम शत्रु को जानते हो और स्वयं को भी जानते हो, तो तुम्हें सौ युद्धों के परिणाम से डरने की आवश्यकता नहीं।"
"Let right deeds be thy motive, not the fruit which comes from them." = "तुम्हारा अधिकार केवल कर्म पर है, उसके फलों पर कभी नहीं।"
"Hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule." = "इस संसार में घृणा से घृणा कभी शांत नहीं होती; घृणा प्रेम से ही शांत होती है, यही सनातन नियम है।"
"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise." = "जैसे ठोस चट्टान हवा से नहीं हिलती, वैसे ही बुद्धिमान लोग निंदा और प्रशंसा के बीच डगमगाते नहीं।"
"Real kindness seeks no return; what return can the world make to rain clouds?" = "सच्ची दया कोई प्रतिदान नहीं चाहती; संसार वर्षा के बादलों को क्या लौटा सकता है?"
"To use bitter words, when kind words are at hand, is like picking unripe fruit when the ripe fruit is there." = "मीठे शब्द उपलब्ध होते हुए भी कड़वे शब्द बोलना वैसा ही है, जैसे पके फल के रहते कच्चा फल तोड़ना।"
"If you shed tears when you miss the sun, you also miss the stars." = "यदि तुम सूरज के छूट जाने पर आँसू बहाओगे, तो तारे भी तुमसे छूट जाएँगे।"
"We come nearest to the great when we are great in humility." = "हम महान के सबसे निकट तब आते हैं, जब हम विनम्रता में महान होते हैं।"
"If you shut your door to all errors truth will be shut out." = "यदि तुम सारी भूलों के लिए अपना द्वार बंद कर दोगे, तो सत्य भी बाहर रह जाएगा।"
"The roots below the earth claim no rewards for making the branches fruitful." = "धरती के नीचे की जड़ें शाखाओं को फलदार बनाने का कोई पुरस्कार नहीं माँगतीं।"
"He who is too busy doing good finds no time to be good." = "जो भलाई करने में बहुत व्यस्त है, उसे भला होने का समय नहीं मिलता।"
"Let your life lightly dance on the edges of Time like dew on the tip of a leaf." = "तुम्हारा जीवन समय के किनारों पर हल्के से नाचे, जैसे पत्ते की नोक पर ओस।"
"If you are irritated by every rub, how will your mirror be polished?" = "यदि तुम हर रगड़ से चिढ़ जाओगे, तो तुम्हारा दर्पण कैसे चमकेगा?"
"If you are wholly perplexed and in straits, have patience, for patience is the key to joy." = "यदि तुम पूरी तरह उलझन और संकट में हो, तो धैर्य रखो, क्योंकि धैर्य आनंद की कुंजी है।"
"Come, seek, for search is the foundation of fortune: every success depends upon focusing the heart." = "आओ, खोजो, क्योंकि खोज ही सौभाग्य की नींव है: हर सफलता हृदय को एकाग्र करने पर निर्भर है।"
"If thou covetest riches, ask not but for contentment, which is an immense treasure." = "यदि तुम्हें धन की लालसा है, तो संतोष के सिवा कुछ मत माँगो, जो एक अपार ख़ज़ाना है।"
"Use a sweet tongue, courtesy, and gentleness, and thou mayst manage to guide an elephant with a hair." = "मीठी वाणी, शिष्टता और नम्रता से काम लो, तो तुम एक बाल से हाथी को भी चला सकते हो।"
"Were the diver to think on the jaws of the shark, he would never lay hands on the precious pearl." = "यदि गोताख़ोर शार्क के जबड़ों के बारे में सोचता, तो वह कभी अनमोल मोती को हाथ न लगा पाता।"
"How well said the aged farmer to his son, O light of my eyes, thou wilt not reap save that which thou hast sown." = "बूढ़े किसान ने अपने बेटे से कितना सही कहा: हे मेरी आँखों के तारे, तुम वही काटोगे जो तुमने बोया है।"
"Ah, make the most of what we yet may spend, before we too into the Dust descend." = "आह, जो कुछ हमें अभी ख़र्च करना है उसका भरपूर आनंद लो, इससे पहले कि हम भी मिट्टी में मिल जाएँ।"
"Mighty is he who has knowledge." = "जो ज्ञानी है, वही शक्तिशाली है।"
"It is in general the unexplored that attracts us." = "सामान्यतः अनजाना ही हमें आकर्षित करता है।"
"Leave undone whatever you hesitate to do." = "जिस काम को करने में तुम्हें संकोच हो, उसे मत करो।"
"Seek not the paths of the ancients; seek that which the ancients sought." = "प्राचीनों के पदचिह्न मत खोजो; वह खोजो जो प्राचीनों ने खोजा था।"
"Every day is a journey, and the journey itself is home." = "हर दिन एक यात्रा है, और यात्रा ही घर है।"
"The old pond: a frog jumps in — the sound of the water." = "पुराना तालाब: एक मेंढक कूदता है — पानी की आवाज़।"
"Step by step walk the thousand-mile road." = "क़दम-दर-क़दम हज़ार मील की राह चलो।"
"Think lightly of yourself and deeply of the world." = "स्वयं के बारे में हल्के से सोचो और संसार के बारे में गहराई से।"
"Let us dream of evanescence, and linger in the beautiful foolishness of things." = "आइए, क्षणभंगुरता के स्वप्न देखें, और वस्तुओं की सुंदर मूर्खता में ठहरें।"
"Fall down seven times, get up eight." = "सात बार गिरो, आठ बार उठो।"
"Even monkeys fall from trees." = "बंदर भी पेड़ से गिर जाते हैं।"
"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge." = "तुम पशुओं की तरह जीने के लिए नहीं बने, बल्कि सद्गुण और ज्ञान की खोज के लिए बने हो।"
"This above all: to thine own self be true." = "सबसे बढ़कर यह: अपने प्रति सच्चे रहो।"
"There is nothing either good or bad, but thinking makes it so." = "कुछ भी अच्छा या बुरा नहीं होता, सोच ही उसे ऐसा बनाती है।"
"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt." = "हमारे संदेह विश्वासघाती हैं, और प्रयास करने से डराकर हमसे वह भलाई छीन लेते हैं जो हम अक्सर पा सकते थे।"
"Diligence is the mother of good fortune." = "परिश्रम सौभाग्य की जननी है।"
"Tell me what company thou keepest, and I'll tell thee what thou art." = "मुझे बताओ कि तुम किसकी संगति में रहते हो, और मैं बता दूँगा कि तुम कौन हो।"
"The greatest thing in the world is to know how to belong to oneself." = "संसार की सबसे बड़ी बात यह जानना है कि स्वयं का कैसे हुआ जाए।"
"Reading maketh a full man; conference a ready man; and writing an exact man." = "पढ़ना मनुष्य को पूर्ण बनाता है, संवाद तत्पर, और लेखन सटीक।"
"If I have seen further it is by standing on the shoulders of Giants." = "यदि मैंने आगे तक देखा है, तो दिग्गजों के कंधों पर खड़े होकर।"
"I would have written a shorter letter, but I did not have the time." = "मैं एक छोटा पत्र लिखता, पर मेरे पास समय नहीं था।"
"Well done is better than well said." = "अच्छा किया हुआ अच्छा कहे हुए से बेहतर है।"
"Let us cultivate our garden." = "आइए, अपने बगीचे की देखभाल करें।"
"Great works are performed not by strength, but perseverance." = "महान कार्य शक्ति से नहीं, बल्कि लगन से संपन्न होते हैं।"
"To err is human, to forgive divine." = "भूल करना मानवीय है, क्षमा करना दैवी।"
"A talent is formed in stillness, a character in the world's torrent." = "प्रतिभा एकांत में निखरती है, और चरित्र संसार की धारा में।"
"It is not enough to know, we must also apply; it is not enough to will, we must also do." = "जानना काफ़ी नहीं, हमें उसे लागू भी करना होगा; चाहना काफ़ी नहीं, हमें करना भी होगा।"
"I do not wish them to have power over men; but over themselves." = "मैं नहीं चाहती कि उनका पुरुषों पर अधिकार हो, बल्कि स्वयं पर।"
"One half of the world cannot understand the pleasures of the other." = "आधी दुनिया दूसरी आधी के सुखों को नहीं समझ सकती।"
"Nothing is so painful to the human mind as a great and sudden change." = "मानव मन के लिए किसी बड़े और अचानक परिवर्तन जितना पीड़ादायक कुछ नहीं।"
"I am no bird; and no net ensnares me; I am a free human being with an independent will." = "मैं कोई पंछी नहीं हूँ; और कोई जाल मुझे नहीं फँसाता; मैं स्वतंत्र इच्छा वाली एक स्वतंत्र मनुष्य हूँ।"
"Nothing great was ever achieved without enthusiasm." = "उत्साह के बिना कभी कुछ महान प्राप्त नहीं हुआ।"
"Write it on your heart that every day is the best day in the year." = "अपने हृदय पर लिख लो कि हर दिन वर्ष का सबसे अच्छा दिन है।"
"Simplify, simplify." = "सरल बनाओ, सरल बनाओ।"
"Rather than love, than money, than fame, give me truth." = "प्रेम से बढ़कर, धन से बढ़कर, यश से बढ़कर, मुझे सत्य दो।"
"A man who dares to waste one hour of time has not discovered the value of life." = "जो मनुष्य एक घंटा भी व्यर्थ गँवाने का साहस करता है, उसने जीवन का मूल्य नहीं पहचाना।"
"The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves." = "एनालिटिकल इंजन बीजगणितीय पैटर्न ठीक वैसे ही बुनता है, जैसे जैकार्ड करघा फूल और पत्तियाँ बुनता है।"
"Everything comes in time to him who knows how to wait." = "जो प्रतीक्षा करना जानता है, उसे समय पर सब कुछ मिल जाता है।"
"What do we live for, if it is not to make life less difficult to each other?" = "यदि एक-दूसरे का जीवन कम कठिन बनाने के लिए नहीं, तो हम जीते किसलिए हैं?"
"To live is so startling, it leaves but little room for other occupations." = "जीना इतना विस्मयकारी है कि यह दूसरे कामों के लिए बहुत कम जगह छोड़ता है।"
"I'm not afraid of storms, for I'm learning how to sail my ship." = "मैं तूफ़ानों से नहीं डरती, क्योंकि मैं अपना जहाज़ चलाना सीख रही हूँ।"
"Begin at the beginning, and go on till you come to the end: then stop." = "शुरुआत से शुरू करो, और अंत तक पहुँचने तक चलते रहो: फिर रुक जाओ।"
"No one is useless in this world who lightens the burden of it for any one else." = "इस संसार में वह कोई भी व्यर्थ नहीं है, जो किसी और का बोझ हल्का करता है।"
"Courage is resistance to fear, mastery of fear—not absence of fear." = "साहस भय का प्रतिरोध है, भय पर विजय है—भय का अभाव नहीं।"
"When in doubt, tell the truth." = "संदेह हो, तो सच बोलो।"
"Brevity is the sister of talent." = "संक्षिप्तता प्रतिभा की बहन है।"
"One never notices what has been done; one can only see what remains to be done." = "जो किया जा चुका है, उस पर कभी ध्यान नहीं जाता; केवल वही दिखता है जो करना बाक़ी है।"
"We must have perseverance and above all confidence in ourselves." = "हमें लगन चाहिए, और सबसे बढ़कर स्वयं पर विश्वास।"
"Optimism is the faith that leads to achievement; nothing can be done without hope." = "आशावाद वह आस्था है जो उपलब्धि तक ले जाती है; आशा के बिना कुछ नहीं किया जा सकता।"
"Although the world is full of suffering, it is full also of the overcoming of it." = "यद्यपि संसार दुखों से भरा है, वह उन पर विजय पाने से भी भरा है।"
"Life is like riding a bicycle. To keep your balance you must keep moving." = "जीवन साइकिल चलाने जैसा है। संतुलन बनाए रखने के लिए आपको चलते रहना होगा।"
"Imagination is more important than knowledge." = "कल्पना ज्ञान से अधिक महत्वपूर्ण है।"
"No need to hurry. No need to sparkle. No need to be anybody but oneself." = "जल्दी करने की कोई ज़रूरत नहीं। चमकने की कोई ज़रूरत नहीं। स्वयं के सिवा कोई और बनने की ज़रूरत नहीं।"
"Attention is the rarest and purest form of generosity." = "ध्यान उदारता का सबसे दुर्लभ और सबसे शुद्ध रूप है।"
"Think of all the beauty still left around you and be happy." = "अपने आसपास अब भी बची हुई सारी सुंदरता के बारे में सोचो और ख़ुश रहो।"
"It is only with the heart that one can see rightly; what is essential is invisible to the eye." = "केवल हृदय से ही ठीक-ठीक देखा जा सकता है; जो सार है, वह आँखों से अदृश्य है।"
"The first principle is that you must not fool yourself, and you are the easiest person to fool." = "पहला सिद्धांत यह है कि आपको स्वयं को धोखा नहीं देना चाहिए, और स्वयं को धोखा देना सबसे आसान है।"
"You can't use up creativity. The more you use, the more you have." = "रचनात्मकता को ख़त्म नहीं किया जा सकता। आप जितना उपयोग करते हैं, उतनी ही अधिक आपके पास होती है।"
"Proverbs are the palm-oil with which words are eaten." = "कहावतें वह ताड़ का तेल हैं जिसके साथ शब्द खाए जाते हैं।"
"The world is like a Mask dancing. If you want to see it well, you do not stand in one place." = "संसार नाचते हुए मुखौटे की तरह है। यदि आप उसे अच्छी तरह देखना चाहते हैं, तो एक जगह खड़े नहीं रहते।"
"When there is a big tree small ones climb on its back to reach the sun." = "जब कोई बड़ा पेड़ होता है, तो छोटे पेड़ सूरज तक पहुँचने के लिए उसकी पीठ पर चढ़ते हैं।"
"I learned that courage was not the absence of fear, but the triumph over it." = "मैंने सीखा कि साहस भय का अभाव नहीं, बल्कि उस पर विजय है।"
"A good head and a good heart are always a formidable combination." = "एक अच्छा दिमाग़ और एक अच्छा दिल हमेशा एक दुर्जेय मेल होते हैं।"
"It is in the character of growth that we should learn from both pleasant and unpleasant experiences." = "विकास का स्वभाव यही है कि हम सुखद और अप्रिय दोनों तरह के अनुभवों से सीखें।"
"Love is so powerful, it's like unseen flowers under your feet as you walk." = "प्रेम इतना शक्तिशाली है, जैसे चलते समय आपके पैरों के नीचे अनदेखे फूल।"
"Life is not in bits and pieces. It is a magnificent, rhythmic, pulsating symphony." = "जीवन टुकड़ों-टुकड़ों में नहीं है। यह एक भव्य, लयबद्ध, स्पंदित संगीत-रचना है।"
"Hurry, hurry has no blessings." = "जल्दी-जल्दी में कोई बरकत नहीं।"
"The sages were not ashamed to find themselves convinced; for they knew, being wise, that their knowledge was not infinite." = "ज्ञानी स्वयं को क़ायल पाकर लज्जित नहीं होते थे; क्योंकि वे ज्ञानी होने के नाते जानते थे कि उनका ज्ञान असीम नहीं है।"
"To beautify life is to give it an object." = "जीवन को सुंदर बनाना उसे एक उद्देश्य देना है।"
"A grain of poetry suffices to season a century." = "कविता का एक कण एक सदी को सँवारने के लिए काफ़ी है।"
"Little feet of children, two tiny suffering jewels, how can people pass and not see you!" = "बच्चों के नन्हे पाँव, दो छोटे दुखी रत्न, लोग तुम्हें देखे बिना कैसे गुज़र जाते हैं!"
"Writing is nothing more than a guided dream." = "लेखन एक निर्देशित स्वप्न से अधिक कुछ नहीं।"
"Feet, what do I need them for if I have wings to fly." = "पाँव, मुझे उनकी क्या ज़रूरत, अगर मेरे पास उड़ने के लिए पंख हैं।"
"I am not sick. I am broken. But I am happy to be alive as long as I can paint." = "मैं बीमार नहीं हूँ। मैं टूटी हुई हूँ। पर जब तक मैं चित्र बना सकती हूँ, मैं जीवित रहकर ख़ुश हूँ।"
"I must live little by little, it's no good living everything at once." = "मुझे थोड़ा-थोड़ा करके जीना होगा, सब कुछ एक साथ जी लेने का कोई लाभ नहीं।"
"Life is not what one lived, but what one remembers and how one remembers it in order to recount it." = "जीवन वह नहीं जो किसी ने जिया, बल्कि वह है जो वह याद रखता है और उसे सुनाने के लिए कैसे याद रखता है।"
"Fear is inevitable, I have to accept that, but I cannot allow it to paralyze me." = "डर अपरिहार्य है, मुझे यह स्वीकार करना होगा, पर मैं उसे स्वयं को पंगु नहीं बनाने दे सकती।"

"One path with its evidence" = "یک راه با دلیل آن"
"One quiet notification each morning with today's reminder" = "یک اعلان آرام هر صبح با یادآوری امروز"
"Open a verse or hadith in the Jannah panel and return it" = "باز کردن یک آیه یا حدیث در پنل بهشت و بازگرداندن آن"
"Paths" = "راه‌ها"
"Patience when a child dies" = "صبر بر مرگ فرزند"
"People around you" = "اطرافیان شما"
"Perfect your wudu" = "وضو را کامل بگیرید"
"Pray on time" = "نماز را به‌وقت بخوانید"
"Pride, even a grain of it, stands in the way; choose humility." = "تکبر، حتی به اندازهٔ ذره‌ای، سد راه است؛ فروتنی را برگزینید."
"Quote card" = "کارت نقل‌قول"

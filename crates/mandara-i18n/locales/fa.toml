"Searching…" = "در حال جستجو…"
"Seeing Allah" = "دیدار خداوند"
"Seek forgiveness daily" = "هر روز استغفار کنید"
"Seek knowledge" = "در پی دانش باشید"
"Share your food with the needy and sit a while with the sick." = "غذایتان را با نیازمندان قسمت کنید و لختی کنار بیمار بنشینید."
"Show the meaning" = "نمایش معنا"
"Small" = "کوچک"
"Small good deeds, done sincerely and kept up, are the most beloved." = "کارهای نیک کوچک که خالصانه و پیوسته انجام شوند، محبوب‌ترین کارهایند."
"Speak the truth" = "راست بگویید"
"Spread salam" = "سلام را رواج دهید"
"Stay humble" = "فروتن بمانید"
"TODAY'S STEP" = "گام امروز"
"Take an orphan under your wing and you will be close to the Prophet ﷺ." = "یتیمی را زیر بال خود بگیرید تا در کنار پیامبر ﷺ باشید."
"Tap the heart on a verse or hadith to keep it here" = "روی نماد قلب در یک آیه یا حدیث بزنید تا اینجا نگه داشته شود"
"The Qur'an service sent no verses" = "سرویس قرآن هیچ آیه‌ای نفرستاد"
"The Qur'an's text is the Tanzil Project's Uthmani text, copied exactly." = "متن قرآن، متن عثمانی پروژهٔ Tanzil است که دقیقاً رونویسی شده است."
"The heart" = "دل"
"The meaning couldn't be loaded" = "معنا بارگذاری نشد"
"The meaning in your language under the Arabic; the Qur'an's is downloaded once from Tanzil (api.alquran.cloud). Off: Arabic only" = "معنا به زبان شما زیر متن عربی؛ معنای قرآن یک بار از Tanzil (api.alquran.cloud) دانلود می‌شود. خاموش: فقط عربی"
"The paths to Jannah, by group" = "راه‌های بهشت، به تفکیک گروه"
"Their old age is an open door; serve them with love while you can." = "پیری آنان دری گشوده است؛ تا می‌توانید با عشق به آنان خدمت کنید."
"Things to avoid" = "آنچه باید از آن دوری کرد"
"Today's reminder" = "یادآوری امروز"
"Today's step" = "گام امروز"
"Today's step and this week's done days" = "گام امروز و روزهای انجام‌شدهٔ این هفته"

"Morning reminder" = "یادآوری صبحگاهی"
"Move the branch, the stone, the broken glass: small kindness, great reward." = "شاخه، سنگ یا شیشهٔ شکسته را کنار بزنید: مهربانی کوچک، پاداش بزرگ."
"Move today's reminder back one item" = "بردن یادآوری امروز یک مورد به عقب"
"Move today's reminder forward one item (every surface follows)" = "بردن یادآوری امروز یک مورد به جلو (همهٔ سطح‌ها پیروی می‌کنند)"
"Muslim" = "مسلم"
"Needs the Jannah plugin; today's reminder, its rotation and the meaning follow its settings." = "به افزونهٔ بهشت نیاز دارد؛ یادآوری امروز، چرخش آن و معنا از تنظیمات آن پیروی می‌کنند."

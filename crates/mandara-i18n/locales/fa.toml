# ── Quotes ──
"{author}, {work}" = "{author}، {work}"
"A man does not attain everything that he desires; the winds convey whither the ships do not list." = "هر آنچه آدمی آرزو کند به دست نمی‌آورد؛ بادها به سویی می‌وزند که کشتی‌ها نمی‌خواهند."
"A charger's saddle is an exalted throne, the best companions are books alone." = "گرامی‌ترین جای جهان زین اسبی تیزتک است، و بهترین همنشین در روزگار، کتاب."
"If you venture in pursuit of glory, don't be satisfied with less than the stars." = "چون در پی شرفی والا به خطر افتادی، به کمتر از ستارگان خرسند مباش."
"The past resembles the future more than water resembles water." = "گذشته به آینده از آب به آب شبیه‌تر است."
"Skills are acquired only through the repetition of actions." = "مهارت‌ها جز با تکرار کارها به دست نمی‌آیند."
"The knowledge of anything, since all things have causes, is not acquired or complete unless it is known by its causes." = "شناخت هر چیز، از آنجا که همه‌چیز علت‌هایی دارد، به دست نمی‌آید و کامل نمی‌شود مگر آنکه با علت‌هایش شناخته شود."
"The less reason someone has, the more he fancies himself the most rational and most discerning of all." = "هر چه خرد کسی کمتر باشد، بیشتر خود را خردمندترین و تیزبین‌ترین همه می‌پندارد."
"Friendship is always a sweet responsibility, never an opportunity." = "دوستی همواره مسئولیتی شیرین است، هرگز فرصتی برای بهره‌جویی نیست."
"A sense of humour is a sense of proportion." = "حس شوخ‌طبعی، حس تناسب است."
"If you sing of beauty though alone in the heart of the desert you will have an audience." = "اگر از زیبایی آواز سر دهی، هرچند تنها در دل بیابان، شنونده خواهی داشت."
"Work is love made visible." = "کار، عشقی است که آشکار شده است."
"You give but little when you give of your possessions. It is when you give of yourself that you truly give." = "آنگاه که از دارایی‌ات می‌بخشی، اندکی بخشیده‌ای. تنها آنگاه که از خویشتن می‌بخشی، به‌راستی بخشیده‌ای."
"Patience is man's refuge in times of despair, and his armor against misfortunes." = "صبر پناه آدمی در روزگار نومیدی و زره او در برابر مصیبت‌هاست."
"Knowledge is like water and air: it is every citizen's right to enjoy it for free." = "دانش همچون آب و هواست: حق هر شهروندی است که به رایگان از آن بهره‌مند شود."
"Time is like a sword; if you don't cut it, it'll cut you." = "وقت همچون شمشیر است؛ اگر تو آن را نبری، او تو را می‌برد."
"All men by nature desire to know." = "همهٔ آدمیان بالطبع خواستار دانستن‌اند."
"For the things we have to learn before we can do, we learn by doing." = "چیزهایی را که باید پیش از انجامشان بیاموزیم، با انجام دادنشان می‌آموزیم."
"The roots of education are bitter, but the fruit is sweet." = "ریشه‌های آموزش تلخ است، اما میوه‌اش شیرین."
"The beginning is the most important part of any work." = "آغاز، مهم‌ترین بخش هر کاری است."
"You could not step twice into the same river." = "در یک رودخانه دو بار نمی‌توان پا نهاد."
"While we are postponing, life speeds by." = "تا ما کارها را به تعویق می‌اندازیم، زندگی شتابان می‌گذرد."
"We suffer more often in imagination than in reality." = "ما بیشتر در خیال رنج می‌بریم تا در واقعیت."
"It is not that we have a short space of time, but that we waste much of it." = "چنین نیست که زمان اندکی داریم؛ بلکه بخش بزرگی از آن را هدر می‌دهیم."
"He who receives a benefit with gratitude, repays the first installment of it." = "کسی که نیکی را با سپاس می‌پذیرد، نخستین قسط آن را پرداخته است."
"Fire tries gold, misfortune tries brave men." = "آتش، زر را می‌آزماید و ناگواری، دلیران را."
"No longer talk at all about the kind of man that a good man ought to be, but be such." = "دیگر از اینکه انسان نیک چگونه باید باشد سخن مگو؛ چنان باش."
"Very little indeed is necessary for living a happy life." = "برای زیستن زندگی شاد، به‌راستی چیز بسیار اندکی لازم است."
"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig." = "به درون بنگر. سرچشمهٔ نیکی در درون است و اگر همواره بکاوی، همواره خواهد جوشید."
"If it is not right, do not do it: if it is not true, do not say it." = "اگر درست نیست، انجامش مده؛ اگر راست نیست، مگو."
"Confine thyself to the present." = "خود را به زمان حال محدود کن."
"First say to yourself what you would be; and then do what you have to do." = "نخست به خود بگو که می‌خواهی چه باشی؛ سپس آنچه باید بکنی، انجام بده."
"No thing great is created suddenly, any more than a bunch of grapes or a fig." = "هیچ چیز بزرگی ناگهان پدید نمی‌آید، چنان‌که خوشهٔ انگور یا انجیری نیز ناگهان پدید نمی‌آید."
"Men are disturbed not by things, but by the views which they take of things." = "آنچه آدمیان را آشفته می‌کند نه خود چیزها، که برداشتشان از چیزهاست."
"He who has begun has half done. Dare to be wise; begin!" = "آن‌که آغاز کرد، نیمی از کار را انجام داده است. جرئت دانا بودن داشته باش؛ آغاز کن!"
"Practice is the best of all instructors." = "تمرین بهترین آموزگاران است."
"Anyone can hold the helm when the sea is calm." = "وقتی دریا آرام است، هر کسی می‌تواند سکان را به دست گیرد."
"They can because they think they can." = "می‌توانند، چون گمان می‌کنند که می‌توانند."
"If you have a garden and a library, you have everything you need." = "اگر باغی و کتابخانه‌ای داشته باشی، هر آنچه نیاز داری در دست داری."
"Drops of water hollow out a stone." = "قطره‌های آب، سنگ را سوراخ می‌کنند."
"Slow and steady wins the race." = "رهرو آن است که آهسته و پیوسته رود."
"Is it not pleasant to learn with a constant perseverance and application?" = "آیا خوشایند نیست که با پشتکار و کوشش پیوسته بیاموزیم؟"
"If a man keeps cherishing his old knowledge, so as continually to be acquiring new, he may be a teacher of others." = "اگر کسی دانش کهنه‌اش را گرامی بدارد و همواره دانشی نو بیاموزد، می‌تواند آموزگار دیگران باشد."
"Learning without thought is labour lost; thought without learning is perilous." = "آموختن بی‌اندیشه رنجی بیهوده است؛ اندیشیدن بی‌آموختن خطرناک."
"When I walk along with two others, they may serve me as my teachers." = "هنگامی که با دو تن دیگر راه می‌روم، آنان می‌توانند آموزگاران من باشند."
"When the year becomes cold, then we know how the pine and the cypress are the last to lose their leaves." = "چون سال سرد شود، درمی‌یابیم که کاج و سرو آخرین درختانی‌اند که برگ خود را می‌ریزند."
"Do not be desirous to have things done quickly; do not look at small advantages." = "در پی آن مباش که کارها شتابان انجام شوند؛ به سودهای کوچک چشم مدوز."
"What you do not want done to yourself, do not do to others." = "آنچه به خود نمی‌پسندی، به دیگران مپسند."
"The journey of a thousand li commenced with a single step." = "سفر هزار فرسنگی با یک گام آغاز می‌شود."
"He who knows other men is discerning; he who knows himself is intelligent." = "آن‌که دیگران را می‌شناسد، تیزبین است؛ آن‌که خود را می‌شناسد، خردمند."
"He who overcomes others is strong; he who overcomes himself is mighty." = "آن‌که بر دیگران چیره شود نیرومند است؛ آن‌که بر خود چیره شود، به‌راستی تواناست."
"The soft overcomes the hard; and the weak the strong." = "نرم بر سخت چیره می‌شود، و ناتوان بر توانا."
"The great man is the one who does not lose his child's heart." = "بزرگ‌مرد کسی است که دل کودکی‌اش را از دست ندهد."
"You cannot speak of ocean to a well-frog." = "با قورباغهٔ ته چاه نمی‌توان از اقیانوس سخن گفت."
"If you know the enemy and know yourself, you need not fear the result of a hundred battles." = "اگر دشمن را بشناسی و خود را بشناسی، از نتیجهٔ صد نبرد هراسی نخواهی داشت."
"Let right deeds be thy motive, not the fruit which comes from them." = "انگیزه‌ات کردار درست باشد، نه میوه‌ای که از آن به بار می‌آید."
"Hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule." = "نفرت هرگز با نفرت فرو نمی‌نشیند؛ نفرت با عشق فرو می‌نشیند. این قانونی کهن است."
"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise." = "چنان‌که صخره‌ای استوار از باد نمی‌لرزد، خردمندان نیز در میان نکوهش و ستایش نمی‌لغزند."
"Real kindness seeks no return; what return can the world make to rain clouds?" = "مهربانی راستین چشم‌داشت پاداش ندارد؛ جهان چه پاداشی می‌تواند به ابرهای باران‌زا بدهد؟"
"To use bitter words, when kind words are at hand, is like picking unripe fruit when the ripe fruit is there." = "سخن تلخ گفتن آنگاه که سخن نرم در دسترس است، همچون چیدن میوهٔ کال است وقتی میوهٔ رسیده آنجاست."
"If you shed tears when you miss the sun, you also miss the stars." = "اگر برای از دست دادن خورشید اشک بریزی، ستارگان را هم از دست خواهی داد."
"We come nearest to the great when we are great in humility." = "آنگاه به بزرگان نزدیک‌تر می‌شویم که در فروتنی بزرگ باشیم."
"If you shut your door to all errors truth will be shut out." = "اگر در را به روی همهٔ خطاها ببندی، حقیقت نیز پشت در خواهد ماند."
"The roots below the earth claim no rewards for making the branches fruitful." = "ریشه‌های زیر خاک برای باردار کردن شاخه‌ها پاداشی نمی‌خواهند."
"He who is too busy doing good finds no time to be good." = "آن‌که سرگرم نیکی کردن است، فرصت نیک بودن نمی‌یابد."
"Let your life lightly dance on the edges of Time like dew on the tip of a leaf." = "بگذار زندگی‌ات سبکبال بر لبه‌های زمان برقصد، چون شبنم بر نوک برگ."
"If you are irritated by every rub, how will your mirror be polished?" = "گر به هر زخمی تو پرکینه شوی / پس کجا بی‌صیقل آیینه شوی؟"
"If you are wholly perplexed and in straits, have patience, for patience is the key to joy." = "اگر سراسر حیران و در تنگنایی، صبر کن، که صبر کلید گشایش است."
"Come, seek, for search is the foundation of fortune: every success depends upon focusing the heart." = "بیا و بجوی، که جستجو بنیاد بخت است: هر کامیابی در گرو یکسو کردن دل است."
"If thou covetest riches, ask not but for contentment, which is an immense treasure." = "اگر توانگری می‌خواهی، جز قناعت مخواه که گنجی بی‌پایان است."
"Use a sweet tongue, courtesy, and gentleness, and thou mayst manage to guide an elephant with a hair." = "به شیرین‌زبانی و لطف و خوشی / توانی که پیلی به مویی کشی"
"Were the diver to think on the jaws of the shark, he would never lay hands on the precious pearl." = "اگر غواص اندیشهٔ کام نهنگ کند، هرگز مروارید گران‌بها به دست نیاورد."
"How well said the aged farmer to his son, O light of my eyes, thou wilt not reap save that which thou hast sown." = "چه نیکو گفت دهقان سالخورده به پسرش: ای نور دیده، جز آنچه کشته‌ای، نخواهی درود."
"Ah, make the most of what we yet may spend, before we too into the Dust descend." = "دریاب آنچه هنوز در کف داریم، پیش از آنکه ما نیز به خاک فرو شویم."
"Mighty is he who has knowledge." = "توانا بود هر که دانا بود."
"It is in general the unexplored that attracts us." = "معمولاً ناشناخته‌هاست که ما را به خود می‌کشد."
"Leave undone whatever you hesitate to do." = "آنچه در انجامش دودلی، ناکرده بگذار."
"Seek not the paths of the ancients; seek that which the ancients sought." = "در پی راه پیشینیان مباش؛ آنچه را پیشینیان می‌جستند بجوی."
"Every day is a journey, and the journey itself is home." = "هر روز سفری است و خود سفر، خانه است."
"The old pond: a frog jumps in — the sound of the water." = "برکهٔ کهن: قورباغه‌ای می‌جهد درون — آوای آب."
"Step by step walk the thousand-mile road." = "گام به گام، راه هزار فرسنگی را بپیما."
"Think lightly of yourself and deeply of the world." = "به خود اندک بیندیش و به جهان ژرف."
"Let us dream of evanescence, and linger in the beautiful foolishness of things." = "بیایید رؤیای ناپایداری را ببینیم و در بی‌خردی زیبای چیزها درنگ کنیم."
"Fall down seven times, get up eight." = "هفت بار بیفت، هشت بار برخیز."
"Even monkeys fall from trees." = "حتی میمون‌ها هم از درخت می‌افتند."
"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge." = "شما برای آن آفریده نشدید که چون چارپایان زندگی کنید، بلکه برای جستن فضیلت و دانش."
"This above all: to thine own self be true." = "مهم‌تر از همه: با خویشتن خویش صادق باش."
"There is nothing either good or bad, but thinking makes it so." = "هیچ چیز خوب یا بد نیست، این اندیشه است که آن را چنین می‌کند."
"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt." = "تردیدهای ما خائن‌اند و با ترس از تلاش، ما را از نیکی‌ای که چه‌بسا به دست می‌آوردیم محروم می‌کنند."
"Diligence is the mother of good fortune." = "کوشش مادر بخت نیک است."
"Tell me what company thou keepest, and I'll tell thee what thou art." = "تو اول بگو با کیان زیستی / پس آنگه بگویم که تو کیستی"
"The greatest thing in the world is to know how to belong to oneself." = "بزرگ‌ترین چیز در جهان این است که بدانی چگونه از آن خود باشی."
"Reading maketh a full man; conference a ready man; and writing an exact man." = "مطالعه آدمی را کامل می‌کند، گفت‌وگو حاضرجواب و نوشتن دقیق."
"If I have seen further it is by standing on the shoulders of Giants." = "اگر دورتر را دیده‌ام، از آن روست که بر شانهٔ غول‌ها ایستاده‌ام."
"I would have written a shorter letter, but I did not have the time." = "نامه‌ای کوتاه‌تر می‌نوشتم، اما وقتش را نداشتم."
"Well done is better than well said." = "خوب انجام دادن بهتر از خوب گفتن است."
"Let us cultivate our garden." = "باید باغ خود را آباد کنیم."
"Great works are performed not by strength, but perseverance." = "کارهای بزرگ نه با زور، که با پشتکار انجام می‌شوند."
"To err is human, to forgive divine." = "خطا از انسان است و بخشش از خداوند."
"A talent is formed in stillness, a character in the world's torrent." = "استعداد در خلوت شکل می‌گیرد و منش در سیلاب جهان."
"It is not enough to know, we must also apply; it is not enough to will, we must also do." = "دانستن کافی نیست، باید به کار بست؛ خواستن کافی نیست، باید انجام داد."
"I do not wish them to have power over men; but over themselves." = "نمی‌خواهم آنان بر مردان قدرت داشته باشند، بلکه بر خودشان."
"One half of the world cannot understand the pleasures of the other." = "نیمی از جهان لذت‌های نیمهٔ دیگر را درک نمی‌کند."
"Nothing is so painful to the human mind as a great and sudden change." = "هیچ چیز برای ذهن آدمی به اندازهٔ دگرگونی بزرگ و ناگهانی دردناک نیست."
"I am no bird; and no net ensnares me; I am a free human being with an independent will." = "من پرنده نیستم و هیچ توری مرا به دام نمی‌اندازد؛ من انسانی آزادم با اراده‌ای مستقل."
"Nothing great was ever achieved without enthusiasm." = "هیچ کار بزرگی هرگز بی‌شور و شوق به دست نیامده است."
"Write it on your heart that every day is the best day in the year." = "بر دلت بنویس که هر روز بهترین روز سال است."
"Simplify, simplify." = "ساده کن، ساده کن."
"Rather than love, than money, than fame, give me truth." = "بیش از عشق، بیش از پول، بیش از شهرت، حقیقت را به من بده."
"A man who dares to waste one hour of time has not discovered the value of life." = "کسی که جرئت کند حتی یک ساعت از وقتش را هدر دهد، ارزش زندگی را درنیافته است."
"The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves." = "موتور تحلیلی الگوهای جبری می‌بافد، همان‌گونه که دستگاه بافندگی ژاکار گل و برگ می‌بافد."
"Everything comes in time to him who knows how to wait." = "همه‌چیز به‌موقع به کسی می‌رسد که می‌داند چگونه صبر کند."
"What do we live for, if it is not to make life less difficult to each other?" = "برای چه زندگی می‌کنیم، اگر نه برای آنکه زندگی را برای یکدیگر کمتر دشوار کنیم؟"
"To live is so startling, it leaves but little room for other occupations." = "زیستن چنان شگفت‌انگیز است که جای چندانی برای کارهای دیگر نمی‌گذارد."
"I'm not afraid of storms, for I'm learning how to sail my ship." = "از توفان نمی‌هراسم، چون دارم می‌آموزم که کشتی‌ام را چگونه برانم."
"Begin at the beginning, and go on till you come to the end: then stop." = "از آغاز شروع کن و ادامه بده تا به پایان برسی؛ آنگاه بایست."
"No one is useless in this world who lightens the burden of it for any one else." = "در این جهان هیچ‌کس که بار آن را برای دیگری سبک کند، بیهوده نیست."
"Courage is resistance to fear, mastery of fear—not absence of fear." = "شجاعت ایستادگی در برابر ترس و چیرگی بر آن است—نه نبود ترس."
"When in doubt, tell the truth." = "هرگاه تردید داشتی، راست بگو."
"Brevity is the sister of talent." = "ایجاز خواهر استعداد است."
"One never notices what has been done; one can only see what remains to be done." = "آدم هیچ‌گاه کارهای انجام‌شده را نمی‌بیند؛ تنها آنچه مانده است را می‌بیند."
"We must have perseverance and above all confidence in ourselves." = "باید پشتکار داشته باشیم و بیش از همه به خودمان اطمینان."
"Optimism is the faith that leads to achievement; nothing can be done without hope." = "خوش‌بینی ایمانی است که به کامیابی می‌انجامد؛ بی‌امید هیچ کاری از پیش نمی‌رود."
"Although the world is full of suffering, it is full also of the overcoming of it." = "هرچند جهان پر از رنج است، پر از چیره شدن بر آن نیز هست."
"Life is like riding a bicycle. To keep your balance you must keep moving." = "زندگی مانند دوچرخه‌سواری است. برای حفظ تعادل باید به حرکت ادامه دهی."
"Imagination is more important than knowledge." = "تخیل از دانش مهم‌تر است."
"No need to hurry. No need to sparkle. No need to be anybody but oneself." = "نیازی به شتاب نیست. نیازی به درخشیدن نیست. نیازی نیست کسی جز خود باشی."
"Attention is the rarest and purest form of generosity." = "توجه، کمیاب‌ترین و ناب‌ترین شکل بخشندگی است."
"Think of all the beauty still left around you and be happy." = "به همهٔ زیبایی‌هایی بیندیش که هنوز گرداگردت مانده‌اند و شاد باش."
"It is only with the heart that one can see rightly; what is essential is invisible to the eye." = "جز با چشم دل نمی‌شود خوب دید. اصل چیزها از چشم سر پنهان است."
"The first principle is that you must not fool yourself, and you are the easiest person to fool." = "اصل نخست این است که خودت را فریب ندهی؛ و تو آسان‌ترین کسی هستی که می‌شود فریبش داد."
"You can't use up creativity. The more you use, the more you have." = "خلاقیت تمام‌شدنی نیست. هر چه بیشتر به کار ببری، بیشتر داری."
"Proverbs are the palm-oil with which words are eaten." = "ضرب‌المثل‌ها روغن نخلی‌اند که سخن را با آن می‌خورند."
"The world is like a Mask dancing. If you want to see it well, you do not stand in one place." = "جهان همچون نقابی رقصان است. اگر می‌خواهی خوب ببینی‌اش، در یک جا نمی‌ایستی."
"When there is a big tree small ones climb on its back to reach the sun." = "وقتی درختی بزرگ هست، درختان کوچک از پشتش بالا می‌روند تا به خورشید برسند."
"I learned that courage was not the absence of fear, but the triumph over it." = "آموختم که شجاعت نبود ترس نیست، بلکه پیروزی بر آن است."
"A good head and a good heart are always a formidable combination." = "سری خردمند و دلی پاک همواره ترکیبی شکست‌ناپذیرند."
"It is in the character of growth that we should learn from both pleasant and unpleasant experiences." = "سرشت رشد چنین است که هم از تجربه‌های خوشایند بیاموزیم و هم از ناخوشایند."
"Love is so powerful, it's like unseen flowers under your feet as you walk." = "عشق چنان نیرومند است که گویی گل‌هایی نادیده زیر پاهایت می‌روید وقتی راه می‌روی."
"Life is not in bits and pieces. It is a magnificent, rhythmic, pulsating symphony." = "زندگی تکه‌تکه نیست. سمفونی‌ای باشکوه، موزون و تپنده است."
"Hurry, hurry has no blessings." = "شتاب و شتاب، برکتی ندارد."
"The sages were not ashamed to find themselves convinced; for they knew, being wise, that their knowledge was not infinite." = "فرزانگان از قانع شدن شرم نداشتند؛ زیرا خردمندانه می‌دانستند که دانششان بی‌کران نیست."
"To beautify life is to give it an object." = "زیبا کردن زندگی، دادن هدفی به آن است."
"A grain of poetry suffices to season a century." = "دانه‌ای شعر برای چاشنی یک قرن بس است."
"Little feet of children, two tiny suffering jewels, how can people pass and not see you!" = "پاهای کوچک کودکان، دو گوهر خرد رنج‌کشیده، چگونه مردم می‌گذرند و شما را نمی‌بینند!"
"Writing is nothing more than a guided dream." = "نوشتن چیزی جز رؤیایی هدایت‌شده نیست."
"Feet, what do I need them for if I have wings to fly." = "پاها را برای چه می‌خواهم، وقتی بال‌هایی برای پرواز دارم."
"I am not sick. I am broken. But I am happy to be alive as long as I can paint." = "بیمار نیستم. شکسته‌ام. اما تا وقتی بتوانم نقاشی کنم، از زنده بودن خوشحالم."
"I must live little by little, it's no good living everything at once." = "باید ذره‌ذره زندگی کنم؛ زیستن همه‌چیز به یک‌باره فایده‌ای ندارد."
"Life is not what one lived, but what one remembers and how one remembers it in order to recount it." = "زندگی آن نیست که زیسته‌ایم، بلکه آن است که به یاد می‌آوریم و چگونه به یادش می‌آوریم تا روایتش کنیم."
"Fear is inevitable, I have to accept that, but I cannot allow it to paralyze me." = "ترس اجتناب‌ناپذیر است، باید آن را بپذیرم، اما نمی‌توانم بگذارم مرا فلج کند."

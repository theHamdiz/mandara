"Today's verse or hadith and today's step" = "آیه یا حدیث امروز و گام امروز"
"Today's verse or hadith in calligraphy under an arch, with its meaning" = "آیه یا حدیث امروز به خوشنویسی زیر یک طاق، همراه با معنای آن"
"Today's verse or hadith in the quote card's style" = "آیه یا حدیث امروز به سبک کارت نقل‌قول"
"Trust in your Lord" = "به پروردگارتان توکل کنید"
"Try other words or another theme" = "واژه‌های دیگر یا تم دیگری را امتحان کنید"
"Turn back to Him" = "به سوی او بازگردید"
"Turn to Him morning and evening with a sincere plea for forgiveness." = "صبح و شام با استغفاری خالصانه به او روی آورید."
"Unexpected answer from the Qur'an service: {error}" = "پاسخ غیرمنتظره از سرویس قرآن: {error}"
"Verse under an arch" = "آیه زیر طاق"
"Verses and hadith are shown exactly as in their sources. When in doubt, check a reference with a scholar or a printed edition." = "آیه‌ها و احادیث دقیقاً همان‌گونه که در منابعشان آمده نمایش داده می‌شوند. در صورت تردید، مرجع را با یک عالم دینی یا نسخهٔ چاپی بررسی کنید."
"Walk gently and think little of yourself; the humble are honoured there." = "آرام راه بروید و خود را کوچک بشمارید؛ فروتنان آنجا گرامی‌اند."
"Walk to the mosque" = "پیاده به مسجد بروید"
"Wash with care, then pray two rak'ahs with your whole heart." = "با دقت وضو بگیرید، سپس با تمام دل دو رکعت نماز بخوانید."
"What it is like" = "چگونه است"
"What keeps from it" = "آنچه از آن بازمی‌دارد"
"Whatever has happened, sincere repentance opens the way again." = "هر چه پیش آمده باشد، توبهٔ خالصانه دوباره راه را می‌گشاید."
"Whoever you are responsible for, never deceive or neglect them." = "هر کس که مسئولیتش با شماست، هرگز فریبش ندهید و رهایش نکنید."
"With its chain of narrators" = "همراه با سند راویان"
"Worship" = "عبادت"
"Worship Him alone" = "تنها او را بپرستید"
"Your saved verses and hadith, newest first" = "آیه‌ها و احادیث ذخیره‌شدهٔ شما، جدیدترین در ابتدا"
"a path key from `jannah paths`" = "کلید یک راه از `jannah paths`"

"Never harm your neighbour" = "هرگز به همسایه‌تان آزار نرسانید"
"Never pass words between people to set them against each other." = "هرگز میان مردم سخن نبرید تا آنان را با هم دشمن کنید."
"Never swear falsely" = "هرگز سوگند دروغ نخورید"

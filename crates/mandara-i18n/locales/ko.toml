"The past resembles the future more than water resembles water." = "과거는 물이 물을 닮은 것보다 더 미래를 닮았다."
"Skills are acquired only through the repetition of actions." = "기술은 오직 행동을 되풀이해야 얻을 수 있다."
"The knowledge of anything, since all things have causes, is not acquired or complete unless it is known by its causes." = "모든 것에는 원인이 있으므로, 그 원인을 알지 못하면 어떤 것에 대한 지식도 얻을 수 없고 완전해지지도 않는다."
"The less reason someone has, the more he fancies himself the most rational and most discerning of all." = "이성이 적은 사람일수록 자신이 누구보다 이성적이고 분별 있다고 여긴다."
"Friendship is always a sweet responsibility, never an opportunity." = "우정은 언제나 달콤한 책임이지, 결코 기회가 아니다."
"A sense of humour is a sense of proportion." = "유머 감각은 균형 감각이다."
"If you sing of beauty though alone in the heart of the desert you will have an audience." = "사막 한가운데 홀로 있더라도 아름다움을 노래한다면 들어 줄 이가 있을 것이다."
"Work is love made visible." = "일은 눈에 보이게 된 사랑이다."
"You give but little when you give of your possessions. It is when you give of yourself that you truly give." = "가진 것을 줄 때 그대는 조금 주는 것이다. 그대 자신을 줄 때 비로소 참으로 주는 것이다."
"Patience is man's refuge in times of despair, and his armor against misfortunes." = "인내는 절망의 때에 사람의 피난처이며, 불행에 맞서는 갑옷이다."
"Knowledge is like water and air: it is every citizen's right to enjoy it for free." = "지식은 물과 공기와 같다. 모든 시민이 값없이 누릴 권리가 있다."
"Time is like a sword; if you don't cut it, it'll cut you." = "시간은 칼과 같다. 네가 베지 않으면 시간이 너를 벤다."
"All men by nature desire to know." = "모든 인간은 본성적으로 알기를 원한다."
"For the things we have to learn before we can do, we learn by doing." = "할 수 있으려면 먼저 배워야 하는 것들을, 우리는 해 보면서 배운다."
"The roots of education are bitter, but the fruit is sweet." = "교육의 뿌리는 쓰지만 그 열매는 달다."
"The beginning is the most important part of any work." = "시작은 모든 일에서 가장 중요한 부분이다."
"You could not step twice into the same river." = "같은 강물에 두 번 발을 담글 수는 없다."
"While we are postponing, life speeds by." = "우리가 미루는 사이 인생은 빠르게 지나간다."
"We suffer more often in imagination than in reality." = "우리는 현실보다 상상 속에서 더 자주 괴로워한다."
"It is not that we have a short space of time, but that we waste much of it." = "우리에게 주어진 시간이 짧은 것이 아니라, 우리가 그 많은 시간을 낭비하는 것이다."
"He who receives a benefit with gratitude, repays the first installment of it." = "은혜를 감사히 받는 사람은 이미 그 첫 번째 몫을 갚은 것이다."
"Fire tries gold, misfortune tries brave men." = "불은 금을 시험하고, 불행은 용감한 사람을 시험한다."
"No longer talk at all about the kind of man that a good man ought to be, but be such." = "좋은 사람이란 어떠해야 하는지 더 이상 논하지 말고, 그런 사람이 되어라."
"Very little indeed is necessary for living a happy life." = "행복한 삶을 사는 데 필요한 것은 실로 아주 적다."
"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig." = "안을 들여다보라. 안에는 선의 샘이 있으니, 계속 파면 언제까지나 솟아오를 것이다."
"If it is not right, do not do it: if it is not true, do not say it." = "옳지 않다면 하지 말고, 참이 아니라면 말하지 마라."
"Confine thyself to the present." = "현재에만 머물러라."
"First say to yourself what you would be; and then do what you have to do." = "먼저 무엇이 되고 싶은지 스스로에게 말하라. 그리고 해야 할 일을 하라."
"No thing great is created suddenly, any more than a bunch of grapes or a fig." = "포도송이나 무화과가 그렇듯, 위대한 것은 어느 것도 갑자기 생겨나지 않는다."
"Men are disturbed not by things, but by the views which they take of things." = "사람을 괴롭히는 것은 사물 자체가 아니라 사물에 대한 생각이다."
"He who has begun has half done. Dare to be wise; begin!" = "시작한 사람은 이미 반을 해낸 것이다. 감히 지혜로워져라. 시작하라!"
"Practice is the best of all instructors." = "연습은 모든 스승 가운데 최고의 스승이다."
"Anyone can hold the helm when the sea is calm." = "바다가 잔잔할 때는 누구나 키를 잡을 수 있다."
"They can because they think they can." = "그들은 할 수 있다고 생각하기에 할 수 있다."
"If you have a garden and a library, you have everything you need." = "정원과 서재가 있다면 필요한 모든 것을 가진 것이다."
"Drops of water hollow out a stone." = "물방울이 바위를 뚫는다."
"Slow and steady wins the race." = "느려도 꾸준한 자가 경주에서 이긴다."
"Is it not pleasant to learn with a constant perseverance and application?" = "배우고 때때로 익히면 또한 기쁘지 아니한가?"
"If a man keeps cherishing his old knowledge, so as continually to be acquiring new, he may be a teacher of others." = "옛것을 익혀 새것을 알면 남의 스승이 될 수 있다."
"Learning without thought is labour lost; thought without learning is perilous." = "배우기만 하고 생각하지 않으면 얻는 것이 없고, 생각만 하고 배우지 않으면 위태롭다."
"When I walk along with two others, they may serve me as my teachers." = "세 사람이 함께 길을 가면 그중에 반드시 나의 스승이 있다."
"When the year becomes cold, then we know how the pine and the cypress are the last to lose their leaves." = "날이 추워진 뒤에야 소나무와 잣나무가 늦게 시든다는 것을 안다."
"Do not be desirous to have things done quickly; do not look at small advantages." = "빨리 이루려 하지 말고, 작은 이익을 보지 마라."
"What you do not want done to yourself, do not do to others." = "자신이 원하지 않는 일은 남에게도 하지 마라."
"The journey of a thousand li commenced with a single step." = "천 리 길도 한 걸음부터 시작된다."
"He who knows other men is discerning; he who knows himself is intelligent." = "남을 아는 자는 지혜롭고, 자신을 아는 자는 밝다."
"He who overcomes others is strong; he who overcomes himself is mighty." = "남을 이기는 자는 힘이 있고, 자신을 이기는 자는 강하다."
"The soft overcomes the hard; and the weak the strong." = "부드러운 것이 단단한 것을 이기고, 약한 것이 강한 것을 이긴다."
"The great man is the one who does not lose his child's heart." = "대인은 어린아이의 마음을 잃지 않는 사람이다."
"You cannot speak of ocean to a well-frog." = "우물 안 개구리에게는 바다를 이야기할 수 없다."
"If you know the enemy and know yourself, you need not fear the result of a hundred battles." = "적을 알고 나를 알면 백 번 싸워도 그 결과를 두려워할 필요가 없다."
"Let right deeds be thy motive, not the fruit which comes from them." = "올바른 행위 자체를 동기로 삼고, 그로부터 오는 결과를 동기로 삼지 마라."
"Hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule." = "원한은 원한으로 결코 그치지 않는다. 원한은 사랑으로만 그친다. 이것은 오래된 진리다."
"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise." = "단단한 바위가 바람에 흔들리지 않듯, 지혜로운 이는 비난과 칭찬 속에서도 흔들리지 않는다."
"Real kindness seeks no return; what return can the world make to rain clouds?" = "참된 친절은 보답을 바라지 않는다. 세상이 비구름에게 무엇으로 보답할 수 있겠는가?"
"To use bitter words, when kind words are at hand, is like picking unripe fruit when the ripe fruit is there." = "다정한 말이 있는데도 쓴 말을 하는 것은 잘 익은 열매를 두고 덜 익은 열매를 따는 것과 같다."
"If you shed tears when you miss the sun, you also miss the stars." = "해를 놓쳤다고 눈물을 흘리면 별도 놓치게 된다."
"We come nearest to the great when we are great in humility." = "우리는 겸손함에서 위대할 때 위대함에 가장 가까워진다."
"If you shut your door to all errors truth will be shut out." = "모든 잘못에 문을 닫으면 진리도 문밖에 갇히게 된다."
"The roots below the earth claim no rewards for making the branches fruitful." = "땅속의 뿌리는 가지에 열매를 맺게 하고도 보상을 바라지 않는다."
"He who is too busy doing good finds no time to be good." = "선을 행하느라 너무 바쁜 사람은 선해질 시간이 없다."
"Let your life lightly dance on the edges of Time like dew on the tip of a leaf." = "그대의 삶이 나뭇잎 끝의 이슬처럼 시간의 가장자리에서 가볍게 춤추게 하라."
"If you are irritated by every rub, how will your mirror be polished?" = "문지를 때마다 짜증을 낸다면 그대의 거울은 어떻게 닦이겠는가?"
"If you are wholly perplexed and in straits, have patience, for patience is the key to joy." = "몹시 당혹스럽고 궁지에 몰렸다면 인내하라. 인내는 기쁨의 열쇠이니."
"Come, seek, for search is the foundation of fortune: every success depends upon focusing the heart." = "오라, 구하라. 구하는 것이 행운의 토대이니, 모든 성공은 마음을 모으는 데 달려 있다."
"If thou covetest riches, ask not but for contentment, which is an immense treasure." = "부를 탐한다면 오직 만족을 구하라. 만족이야말로 막대한 보물이다."
"Use a sweet tongue, courtesy, and gentleness, and thou mayst manage to guide an elephant with a hair." = "부드러운 말과 예의와 온화함을 갖추면 머리카락 한 올로도 코끼리를 이끌 수 있다."
"Were the diver to think on the jaws of the shark, he would never lay hands on the precious pearl." = "잠수부가 상어의 턱만 생각한다면 결코 귀한 진주를 손에 넣지 못할 것이다."
"How well said the aged farmer to his son, O light of my eyes, thou wilt not reap save that which thou hast sown." = "늙은 농부가 아들에게 참으로 잘 말했다. 내 눈의 빛인 아들아, 너는 네가 뿌린 것만을 거두리라."
"Ah, make the most of what we yet may spend, before we too into the Dust descend." = "아, 아직 누릴 수 있는 것을 마음껏 누리자. 우리도 먼지 속으로 내려가기 전에."
"Mighty is he who has knowledge." = "지식을 가진 자가 강하다."
"It is in general the unexplored that attracts us." = "대개 우리를 끌어당기는 것은 아직 탐험되지 않은 것이다."
"Leave undone whatever you hesitate to do." = "망설여지는 일은 하지 말고 두어라."
"Seek not the paths of the ancients; seek that which the ancients sought." = "옛사람의 발자취를 좇지 말고, 옛사람이 구한 것을 구하라."
"Every day is a journey, and the journey itself is home." = "날마다가 여행이며, 여행 그 자체가 집이다."
"The old pond: a frog jumps in — the sound of the water." = "오래된 연못 — 개구리 뛰어드는 물소리."
"Step by step walk the thousand-mile road." = "한 걸음 한 걸음 천 리 길을 걸어가라."
"Think lightly of yourself and deeply of the world." = "자신은 가볍게, 세상은 깊이 생각하라."
"Let us dream of evanescence, and linger in the beautiful foolishness of things." = "덧없음을 꿈꾸고, 사물의 아름다운 어리석음 속에 머물자."
"Fall down seven times, get up eight." = "일곱 번 넘어지면 여덟 번 일어나라."
"Even monkeys fall from trees." = "원숭이도 나무에서 떨어진다."
"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge." = "너희는 짐승처럼 살려고 태어난 것이 아니라, 덕과 지식을 좇기 위해 태어났다."
"This above all: to thine own self be true." = "무엇보다도 너 자신에게 진실하라."
"There is nothing either good or bad, but thinking makes it so." = "세상에 좋고 나쁜 것은 없다. 생각이 그렇게 만들 뿐이다."
"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt." = "의심은 배신자다. 시도하기를 두려워하게 만들어 얻을 수 있었던 좋은 것을 잃게 한다."
"Diligence is the mother of good fortune." = "근면은 행운의 어머니다."
"Tell me what company thou keepest, and I'll tell thee what thou art." = "네가 누구와 어울리는지 말해 주면 네가 어떤 사람인지 말해 주겠다."
"The greatest thing in the world is to know how to belong to oneself." = "세상에서 가장 위대한 일은 자기 자신에게 속하는 법을 아는 것이다."
"Reading maketh a full man; conference a ready man; and writing an exact man." = "독서는 충실한 사람을, 토론은 준비된 사람을, 글쓰기는 정확한 사람을 만든다."
"If I have seen further it is by standing on the shoulders of Giants." = "내가 더 멀리 보았다면 그것은 거인들의 어깨 위에 서 있었기 때문이다."
"I would have written a shorter letter, but I did not have the time." = "더 짧은 편지를 쓰고 싶었지만 그럴 시간이 없었습니다."
"Well done is better than well said." = "잘한 행동이 잘한 말보다 낫다."
"Let us cultivate our garden." = "우리의 정원을 가꾸어야 한다."
"Great works are performed not by strength, but perseverance." = "위대한 일은 힘이 아니라 끈기로 이루어진다."
"To err is human, to forgive divine." = "실수는 인간의 일이요, 용서는 신의 일이다."
"A talent is formed in stillness, a character in the world's torrent." = "재능은 고요 속에서, 성격은 세상의 격류 속에서 만들어진다."
"It is not enough to know, we must also apply; it is not enough to will, we must also do." = "아는 것만으로는 부족하다. 적용해야 한다. 바라는 것만으로는 부족하다. 행해야 한다."
"I do not wish them to have power over men; but over themselves." = "나는 여성들이 남성을 지배하기를 바라지 않는다. 스스로를 다스리기를 바란다."
"One half of the world cannot understand the pleasures of the other." = "세상의 절반은 나머지 절반의 즐거움을 이해하지 못한다."
"Nothing is so painful to the human mind as a great and sudden change." = "크고 갑작스러운 변화만큼 인간의 마음을 고통스럽게 하는 것은 없다."
"I am no bird; and no net ensnares me; I am a free human being with an independent will." = "나는 새가 아니며, 어떤 그물도 나를 옭아매지 못한다. 나는 독립된 의지를 지닌 자유로운 인간이다."
"Nothing great was ever achieved without enthusiasm." = "열정 없이 이루어진 위대한 일은 없다."
"Write it on your heart that every day is the best day in the year." = "날마다가 한 해 중 가장 좋은 날이라고 마음에 새겨라."
"Simplify, simplify." = "단순하게, 단순하게."
"Rather than love, than money, than fame, give me truth." = "사랑보다, 돈보다, 명예보다 나에게 진실을 달라."
"A man who dares to waste one hour of time has not discovered the value of life." = "한 시간을 감히 허비하는 사람은 아직 삶의 가치를 깨닫지 못한 것이다."
"The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves." = "자카드 직기가 꽃과 잎을 짜듯, 해석 기관은 대수적 패턴을 짠다."
"Everything comes in time to him who knows how to wait." = "기다릴 줄 아는 사람에게는 모든 것이 때맞춰 온다."
"What do we live for, if it is not to make life less difficult to each other?" = "서로의 삶을 조금 덜 힘들게 해 주려는 것이 아니라면 우리는 무엇을 위해 사는가?"
"To live is so startling, it leaves but little room for other occupations." = "산다는 것은 너무나 놀라워서 다른 일을 할 여지가 거의 없다."
"I'm not afraid of storms, for I'm learning how to sail my ship." = "나는 폭풍이 두렵지 않다. 내 배를 모는 법을 배우고 있으니까."
"Begin at the beginning, and go on till you come to the end: then stop." = "처음부터 시작해서 끝에 이를 때까지 계속하라. 그리고 멈춰라."
"No one is useless in this world who lightens the burden of it for any one else." = "다른 누군가의 짐을 덜어 주는 사람은 이 세상에서 결코 쓸모없지 않다."
"Courage is resistance to fear, mastery of fear—not absence of fear." = "용기란 두려움에 맞서고 두려움을 다스리는 것이지, 두려움이 없는 것이 아니다."
"When in doubt, tell the truth." = "망설여질 때는 진실을 말하라."
"Brevity is the sister of talent." = "간결함은 재능의 자매다."
"One never notices what has been done; one can only see what remains to be done." = "이미 해 놓은 일은 눈에 띄지 않는다. 보이는 것은 오직 아직 남은 일뿐이다."
"We must have perseverance and above all confidence in ourselves." = "우리에게는 끈기가, 무엇보다도 자기 자신에 대한 믿음이 있어야 한다."
"Optimism is the faith that leads to achievement; nothing can be done without hope." = "낙관주의는 성취로 이끄는 믿음이다. 희망 없이는 아무것도 이룰 수 없다."
"Although the world is full of suffering, it is full also of the overcoming of it." = "세상은 고통으로 가득하지만, 그것을 이겨 내는 일로도 가득하다."
"Life is like riding a bicycle. To keep your balance you must keep moving." = "인생은 자전거를 타는 것과 같다. 균형을 잡으려면 계속 움직여야 한다."
"Imagination is more important than knowledge." = "상상력은 지식보다 중요하다."
"No need to hurry. No need to sparkle. No need to be anybody but oneself." = "서두를 필요도, 빛날 필요도 없다. 자기 자신 말고 다른 누군가가 될 필요도 없다."
"Attention is the rarest and purest form of generosity." = "주의를 기울이는 것은 가장 드물고 가장 순수한 형태의 너그러움이다."
"Think of all the beauty still left around you and be happy." = "주변에 아직 남아 있는 모든 아름다움을 생각하며 행복하라."
"It is only with the heart that one can see rightly; what is essential is invisible to the eye." = "마음으로 보아야만 제대로 볼 수 있다. 가장 중요한 것은 눈에 보이지 않는다."
"The first principle is that you must not fool yourself, and you are the easiest person to fool." = "첫 번째 원칙은 자신을 속이지 않는 것이다. 그리고 자신이야말로 가장 속이기 쉬운 사람이다."
"You can't use up creativity. The more you use, the more you have." = "창의력은 다 써 버릴 수 없다. 쓰면 쓸수록 더 많아진다."
"Proverbs are the palm-oil with which words are eaten." = "속담은 말을 맛있게 먹게 해 주는 야자유다."
"The world is like a Mask dancing. If you want to see it well, you do not stand in one place." = "세상은 춤추는 가면과 같다. 잘 보고 싶다면 한자리에 서 있지 마라."
"When there is a big tree small ones climb on its back to reach the sun." = "큰 나무가 있으면 작은 나무들이 그 등을 타고 올라 햇빛에 닿는다."
"I learned that courage was not the absence of fear, but the triumph over it." = "나는 용기란 두려움이 없는 것이 아니라 두려움을 이겨 내는 것임을 배웠다."
"A good head and a good heart are always a formidable combination." = "좋은 머리와 좋은 마음은 언제나 무서운 조합이다."
"It is in the character of growth that we should learn from both pleasant and unpleasant experiences." = "즐거운 경험과 불쾌한 경험 모두에서 배우는 것, 그것이 성장의 본질이다."
"Love is so powerful, it's like unseen flowers under your feet as you walk." = "사랑은 너무나 강해서, 걸을 때 발밑에 피어 있는 보이지 않는 꽃과 같다."
"Life is not in bits and pieces. It is a magnificent, rhythmic, pulsating symphony." = "삶은 조각조각 나뉜 것이 아니다. 삶은 장엄하고 리듬감 있게 고동치는 교향곡이다."
"Hurry, hurry has no blessings." = "서두르고 또 서두르면 복이 없다."
"The sages were not ashamed to find themselves convinced; for they knew, being wise, that their knowledge was not infinite." = "현자들은 설득당하는 것을 부끄러워하지 않았다. 지혜로웠기에 자신의 지식이 무한하지 않다는 것을 알았기 때문이다."
"To beautify life is to give it an object." = "삶을 아름답게 한다는 것은 삶에 목적을 준다는 것이다."
"A grain of poetry suffices to season a century." = "한 알의 시만으로도 한 세기를 맛깔나게 하기에 충분하다."
"Little feet of children, two tiny suffering jewels, how can people pass and not see you!" = "아이들의 작은 발, 고통받는 두 개의 작은 보석이여, 사람들은 어찌 너희를 보지 못하고 지나칠 수 있는가!"
"Writing is nothing more than a guided dream." = "글쓰기는 이끌려 가는 꿈에 지나지 않는다."
"Feet, what do I need them for if I have wings to fly." = "발이여, 날 수 있는 날개가 있는데 너희가 왜 필요하겠는가."
"I am not sick. I am broken. But I am happy to be alive as long as I can paint." = "나는 아픈 것이 아니라 부서진 것이다. 하지만 그림을 그릴 수 있는 한 살아 있어서 행복하다."
"I must live little by little, it's no good living everything at once." = "조금씩 살아가야 한다. 모든 것을 한꺼번에 사는 것은 좋지 않다."
"Life is not what one lived, but what one remembers and how one remembers it in order to recount it." = "삶이란 살아온 것이 아니라, 기억하는 것, 그리고 그것을 이야기하기 위해 어떻게 기억하는가이다."
"Fear is inevitable, I have to accept that, but I cannot allow it to paralyze me." = "두려움은 피할 수 없고 나는 그것을 받아들여야 한다. 하지만 두려움에 마비되도록 내버려 둘 수는 없다."

"River {version} runs window management in a separate program and no longer has the river-control and river-status protocols, so Mandara can't show or switch its tags, send its binds or follow its windows. Mandara works with River's classic line (0.3, packaged as river-classic)." = "River {version}는 창 관리를 별도 프로그램에서 하며 river-control과 river-status 프로토콜이 더 이상 없으므로, Mandara는 태그를 표시하거나 전환하고, 단축키를 보내고, 창을 따라갈 수 없습니다. Mandara는 River의 클래식 계열(0.3, river-classic 패키지)에서 동작합니다."
"River's config is your init program, which Mandara never edits: Mandara sends River its colours, rules, input settings and keys when the shell starts and on every change. To start Mandara with River, add this line to your init: {line}" = "River의 설정은 init 프로그램이며 Mandara는 절대 편집하지 않습니다. Mandara는 셸이 시작될 때와 변경할 때마다 색, 규칙, 입력 설정, 키를 River에 보냅니다. River와 함께 Mandara를 시작하려면 init에 다음 줄을 추가하세요: {line}"
"Your River init doesn't start Mandara. Mandara never edits it: add this line to it yourself: {line}" = "River init이 Mandara를 시작하지 않습니다. Mandara는 이 파일을 편집하지 않으니 다음 줄을 직접 추가하세요: {line}"
"Your init maps {chord}, which Mandara binds too: Mandara leaves yours and skips its own." = "init에서 {chord}을(를) 매핑하는데 Mandara도 같은 키를 씁니다. Mandara는 사용자의 매핑을 두고 자신의 것은 건너뜁니다."
"River keeps no display settings of its own: set them in your init with a tool such as wlr-randr or kanshi" = "River는 자체 디스플레이 설정을 저장하지 않습니다. wlr-randr나 kanshi 같은 도구로 init에서 설정하세요"

"Sway reads Mandara's file where your config includes it. Mandara adds that line at the end, so its colours and gaps apply over the settings above it, but not over any you add below it. Mandara sets no rounded corners, opacity, blur, shadows or animations on Sway; the bar's layout pill cycles through the focused container's layouts." = "Sway는 설정 파일이 Mandara의 파일을 포함하는 위치에서 그 파일을 읽습니다. Mandara는 그 줄을 끝에 추가하므로 색과 간격이 그 앞의 설정 위에는 적용되지만, 그 뒤에 추가한 설정 위에는 적용되지 않습니다. Mandara는 Sway에서 둥근 모서리, 불투명도, 흐림, 그림자, 애니메이션을 설정하지 않으며, 바의 레이아웃 필은 포커스된 컨테이너의 레이아웃을 차례로 전환합니다."


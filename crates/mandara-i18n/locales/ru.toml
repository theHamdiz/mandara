"The admin helper couldn't be installed, so nothing was changed." = "Не удалось установить помощника администратора, поэтому ничего не изменилось."
"by {author} · {stars} stars" = "автор {author} · звёзд: {stars}"
"{count} stars" = "звёзд: {count}"
"{file} doesn't match the signed checksums" = "{file} не совпадает с подписанными контрольными суммами"

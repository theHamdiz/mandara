# Built-in theme descriptions
"Abyssal Mediterranean blue, sea-glass turquoise and sun-warmed limestone." = "Buluu ya kina ya Mediterania, feruzi ya kioo cha baharini na mawe ya chokaa yenye joto la jua."
"Royal indigo dusk over the palace gardens, coral sky and an amber lighthouse." = "Jioni ya nili juu ya bustani za kasri, anga la matumbawe na mnara wa taa wa kaharabu."
"True OLED onyx with precious warm gold and emerald speculars." = "Nyeusi halisi kwa OLED, yenye mng’ao wa dhahabu ya joto na zumaridi."
"Sandstone ramparts at golden hour, harbour water and terracotta." = "Kuta za mawe ya mchanga katika mwanga wa machweo, maji ya bandari na rangi ya udongo uliochomwa."
"The ancient lighthouse: a luminous beam across deep night navy and harbour lights." = "Mnara wa taa wa kale: mwangaza unaopita kwenye buluu ya usiku na taa za bandari."
"Evening over Stanley Bridge: coral, apricot and lavender over a plum sea." = "Jioni juu ya Daraja la Stanley: matumbawe, parachichi na lavenda juu ya bahari ya rangi ya zambarau iliyokolea."
"Mocha after dark, Latte by day." = "Mocha usiku, Latte mchana."
"Main for nights, Dawn for mornings." = "Main kwa usiku, Dawn kwa asubuhi."
"Wave at night, Lotus in daylight." = "Wave usiku, Lotus mchana."
"Night and Day." = "Usiku na mchana."
"Polar Night and Snow Storm." = "Polar Night na Snow Storm."
"Retro groove, dark and light." = "Mwonekano wa zamani, wenye rangi nyeusi na angavu."
"Cosmic neon green and cyan on deep indigo (light variant derived)." = "Kijani cha neon na samawati nyangavu kwenye nili iliyokolea; toleo angavu limetokana na rangi hizi."
"Warm peach and mint on near-black (light variant derived)." = "Rangi ya pichi yenye joto na mnanaa kwenye mandharinyuma karibu nyeusi; toleo angavu limetokana na rangi hizi."
"Deep midnight navy with pale citrine, soft lavender and mint." = "Buluu ya usiku iliyokolea pamoja na sitrini hafifu, lavenda laini na mnanaa."


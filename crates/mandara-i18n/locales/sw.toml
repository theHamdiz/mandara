"River {version} runs window management in a separate program and no longer has the river-control and river-status protocols, so Mandara can't show or switch its tags, send its binds or follow its windows. Mandara works with River's classic line (0.3, packaged as river-classic)." = "River {version} huendesha udhibiti wa madirisha katika programu tofauti na haina tena itifaki za river-control na river-status, kwa hiyo Mandara haiwezi kuonyesha au kubadilisha lebo zake, kutuma mikato yake au kufuatilia madirisha yake. Mandara hufanya kazi na tawi la kawaida la River (0.3, lililofungashwa kama river-classic)."

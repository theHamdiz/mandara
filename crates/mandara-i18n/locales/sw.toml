"Anyone can hold the helm when the sea is calm." = "Yeyote anaweza kushika usukani bahari ikiwa shwari."
"They can because they think they can." = "Wanaweza kwa sababu wanafikiri wanaweza."
"If you have a garden and a library, you have everything you need." = "Ukiwa na bustani na maktaba, una kila unachohitaji."
"Drops of water hollow out a stone." = "Matone ya maji huyatoboa jiwe."
"Slow and steady wins the race." = "Polepole na uthabiti hushinda mbio."
"Is it not pleasant to learn with a constant perseverance and application?" = "Je, si furaha kujifunza kwa uvumilivu na bidii ya kudumu?"
"If a man keeps cherishing his old knowledge, so as continually to be acquiring new, he may be a teacher of others." = "Mtu akiendelea kuthamini elimu yake ya zamani, huku akipata mpya daima, anaweza kuwa mwalimu wa wengine."
"Learning without thought is labour lost; thought without learning is perilous." = "Kujifunza bila kufikiri ni kazi iliyopotea; kufikiri bila kujifunza ni hatari."
"When I walk along with two others, they may serve me as my teachers." = "Ninapotembea na wengine wawili, wanaweza kunihudumia kama walimu wangu."
"When the year becomes cold, then we know how the pine and the cypress are the last to lose their leaves." = "Mwaka unapokuwa baridi, ndipo tunajua jinsi msonobari na mberoshi ndio wa mwisho kupoteza majani."
"Do not be desirous to have things done quickly; do not look at small advantages." = "Usitamani mambo yafanywe haraka; usiangalie faida ndogo."
"What you do not want done to yourself, do not do to others." = "Usiyotaka yakufanyike, usiwafanyie wengine."
"The journey of a thousand li commenced with a single step." = "Safari ya li elfu ilianza kwa hatua moja."
"He who knows other men is discerning; he who knows himself is intelligent." = "Anayewajua wengine ni mwenye utambuzi; anayejijua ni mwenye akili."
"He who overcomes others is strong; he who overcomes himself is mighty." = "Anayewashinda wengine ni hodari; anayejishinda ni mwenye nguvu."
"The soft overcomes the hard; and the weak the strong." = "Laini hushinda ngumu; na dhaifu hushinda hodari."
"The great man is the one who does not lose his child's heart." = "Mtu mkuu ni yule asiyepoteza moyo wa mtoto."
"You cannot speak of ocean to a well-frog." = "Huwezi kuzungumzia bahari kwa chura wa kisima."
"If you know the enemy and know yourself, you need not fear the result of a hundred battles." = "Ukimjua adui na ukijijua, huna haja ya kuogopa matokeo ya vita mia."
"Let right deeds be thy motive, not the fruit which comes from them." = "Matendo ya haki yawe nia yako, si tunda linalotokana nayo."
"Hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule." = "Chuki haikomi kwa chuki wakati wowote: chuki hukoma kwa upendo, hii ni kanuni ya zamani."
"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise." = "Kama mwamba thabiti hautikiswi na upepo, wenye hekima hawayumbishwi katikati ya lawama na sifa."
"Real kindness seeks no return; what return can the world make to rain clouds?" = "Wema wa kweli hautafuti malipo; dunia inaweza kulipa nini mawingu ya mvua?"
"To use bitter words, when kind words are at hand, is like picking unripe fruit when the ripe fruit is there." = "Kutumia maneno machungu, maneno mema yakiwepo, ni kama kuchuma tunda bichi tunda lililoiva likiwepo."
"If you shed tears when you miss the sun, you also miss the stars." = "Ukimwaga machozi unapokosa jua, unakosa nyota pia."
"We come nearest to the great when we are great in humility." = "Tunakaribia wakuu tunapokuwa wakuu katika unyenyekevu."
"If you shut your door to all errors truth will be shut out." = "Ukifunga mlango wako kwa makosa yote, ukweli utafungwa nje."
"The roots below the earth claim no rewards for making the branches fruitful." = "Mizizi chini ya ardhi haidai thawabu kwa kufanya matawi yawe na matunda."
"He who is too busy doing good finds no time to be good." = "Aliye na shughuli nyingi za kutenda mema hapati muda wa kuwa mwema."
"Let your life lightly dance on the edges of Time like dew on the tip of a leaf." = "Acha maisha yako yacheze taratibu kwenye ukingo wa Wakati kama umande kwenye ncha ya jani."
"If you are irritated by every rub, how will your mirror be polished?" = "Ukikasirishwa na kila msuguano, kioo chako kitapambwa vipi?"
"If you are wholly perplexed and in straits, have patience, for patience is the key to joy." = "Ukiwa umefadhaika kabisa na katika shida, kuwa na subira, kwa maana subira ni ufunguo wa furaha."
"Come, seek, for search is the foundation of fortune: every success depends upon focusing the heart." = "Njoo, tafuta, kwa maana kutafuta ndio msingi wa bahati: kila mafanikio hutegemea kuuelekeza moyo."
"If thou covetest riches, ask not but for contentment, which is an immense treasure." = "Ukitamani mali, usiombe isipokuwa kuridhika, ambayo ni hazina kubwa."
"Use a sweet tongue, courtesy, and gentleness, and thou mayst manage to guide an elephant with a hair." = "Tumia ulimi mtamu, adabu, na upole, na unaweza kuongoza tembo kwa unywele."
"Were the diver to think on the jaws of the shark, he would never lay hands on the precious pearl." = "Mzamiaji akifikiria taya za papa, hangewahi kushika lulu ya thamani."
"How well said the aged farmer to his son, O light of my eyes, thou wilt not reap save that which thou hast sown." = "Alisema vizuri mkulima mzee kwa mwanawe, ewe nuru ya macho yangu, hutavuna isipokuwa ulichopanda."
"Ah, make the most of what we yet may spend, before we too into the Dust descend." = "Ewe, tumia vizuri tunachoweza kutumia bado, kabla sisi pia tushuke kwenye mavumbi."
"Mighty is he who has knowledge." = "Mwenye nguvu ni yule mwenye elimu."
"It is in general the unexplored that attracts us." = "Kwa ujumla kisichochunguzwa ndicho kinachotuvutia."
"Leave undone whatever you hesitate to do." = "Acha usiyofanya chochote unachosita kufanya."
"Seek not the paths of the ancients; seek that which the ancients sought." = "Usitafute njia za wahenga; tafuta walichotafuta wahenga."
"Every day is a journey, and the journey itself is home." = "Kila siku ni safari, na safari yenyewe ni nyumbani."
"The old pond: a frog jumps in — the sound of the water." = "Bwawa la zamani: chura anaruka ndani — sauti ya maji."
"Step by step walk the thousand-mile road." = "Hatua kwa hatua tembea barabara ya maili elfu."
"Think lightly of yourself and deeply of the world." = "Jifikirie kidogo na ulimwengu kwa kina."
"Let us dream of evanescence, and linger in the beautiful foolishness of things." = "Tuote juu ya kupita, na tukae katika upumbavu mzuri wa vitu."
"Fall down seven times, get up eight." = "Anguka mara saba, inuka mara nane."
"Even monkeys fall from trees." = "Hata nyani huanguka kutoka miti."
"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge." = "Hamkuumbwa kuishi kama wanyama, bali kufuata fadhila na elimu."
"This above all: to thine own self be true." = "Zaidi ya yote: uwe mwaminifu kwako mwenyewe."
"There is nothing either good or bad, but thinking makes it so." = "Hakuna kilicho chema wala kibaya, bali kufikiri hukifanya hivyo."
"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt." = "Mashaka yetu ni wasaliti, na hutufanya tupoteze mema tunayoweza kushinda, kwa kuogopa kujaribu."
"Diligence is the mother of good fortune." = "Bidii ni mama wa bahati njema."
"Tell me what company thou keepest, and I'll tell thee what thou art." = "Niambie kampuni unayoishika, nami nitakuambia wewe ni nani."
"The greatest thing in the world is to know how to belong to oneself." = "Jambo kubwa zaidi duniani ni kujua jinsi ya kujimiliki."
"Reading maketh a full man; conference a ready man; and writing an exact man." = "Kusoma humfanya mtu kamili; mazungumzo humfanya tayari; na kuandika humfanya sahihi."
"If I have seen further it is by standing on the shoulders of Giants." = "Nikiwa nimeona mbali zaidi, ni kwa kusimama mabegani mwa Majitu."
"I would have written a shorter letter, but I did not have the time." = "Ningeliandika barua fupi zaidi, lakini sikuwa na muda."
"Well done is better than well said." = "Kufanywa vizuri ni bora kuliko kusemwa vizuri."
"Let us cultivate our garden." = "Tulime bustani yetu."
"Great works are performed not by strength, but perseverance." = "Kazi kubwa hufanywa si kwa nguvu, bali kwa uvumilivu."
"To err is human, to forgive divine." = "Kukosea ni kwa binadamu, kusamehe ni kwa Mungu."
"A talent is formed in stillness, a character in the world's torrent." = "Kipaji huundwa katika utulivu, tabia katika mkondo wa ulimwengu."
"It is not enough to know, we must also apply; it is not enough to will, we must also do." = "Haitoshi kujua, lazima pia tutumie; haitoshi kutaka, lazima pia tufanye."
"I do not wish them to have power over men; but over themselves." = "Sitaki wawe na mamlaka juu ya watu; bali juu yao wenyewe."
"One half of the world cannot understand the pleasures of the other." = "Nusu moja ya dunia haiwezi kuelewa furaha ya nyingine."
"Nothing is so painful to the human mind as a great and sudden change." = "Hakuna kinachouma akili ya binadamu kama mabadiliko makubwa na ya ghafla."
"I am no bird; and no net ensnares me; I am a free human being with an independent will." = "Mimi si ndege; na hakuna wavu unaninaswa; mimi ni binadamu huru mwenye utashi huru."
"Nothing great was ever achieved without enthusiasm." = "Hakuna kitu kikubwa kilichowahi kufikiwa bila shauku."
"Write it on your heart that every day is the best day in the year." = "Kiandike moyoni mwako kwamba kila siku ndiyo siku bora ya mwaka."
"Simplify, simplify." = "Rahisisha, rahisisha."
"Rather than love, than money, than fame, give me truth." = "Badala ya upendo, pesa, sifa, nipe ukweli."
"A man who dares to waste one hour of time has not discovered the value of life." = "Mtu anayethubutu kupoteza saa moja ya muda hajagundua thamani ya maisha."
"The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves." = "Injini ya Uchambuzi hufuma mifumo ya aljebra kama kitanzi cha Jacquard kinavyofuma maua na majani."
"Everything comes in time to him who knows how to wait." = "Kila kitu huja kwa wakati kwa yule ajuaye kusubiri."
"What do we live for, if it is not to make life less difficult to each other?" = "Tunaishi kwa nini, ikiwa si kufanya maisha kuwa magumu kidogo kwa kila mmoja?"
"To live is so startling, it leaves but little room for other occupations." = "Kuishi ni kushangaza sana, huacha nafasi ndogo kwa shughuli nyingine."
"I'm not afraid of storms, for I'm learning how to sail my ship." = "Siogopi dhoruba, kwa maana ninajifunza jinsi ya kuendesha meli yangu."
"Begin at the beginning, and go on till you come to the end: then stop." = "Anza mwanzoni, na endelea hadi ufikie mwisho: kisha simama."
"No one is useless in this world who lightens the burden of it for any one else." = "Hakuna mtu asiye na faida duniani anayepunguza mzigo wake kwa mtu mwingine."
"Courage is resistance to fear, mastery of fear—not absence of fear." = "Ujasiri ni upinzani dhidi ya hofu, ustadi wa hofu—si kutokuwepo kwa hofu."
"When in doubt, tell the truth." = "Ukiwa na shaka, sema ukweli."
"Brevity is the sister of talent." = "Ufupi ni dada wa kipaji."
"One never notices what has been done; one can only see what remains to be done." = "Mtu hawatambui kilichofanywa; anaweza kuona tu kinachobaki kufanywa."
"We must have perseverance and above all confidence in ourselves." = "Lazima tuwe na uvumilivu na zaidi ya yote imani kwetu wenyewe."
"Optimism is the faith that leads to achievement; nothing can be done without hope." = "Matumaini ni imani inayoongoza kwenye mafanikio; hakuna kinachoweza kufanywa bila tumaini."
"Although the world is full of suffering, it is full also of the overcoming of it." = "Ingawa ulimwengu umejaa mateso, umejaa pia kuyashinda."
"Life is like riding a bicycle. To keep your balance you must keep moving." = "Maisha ni kama kuendesha baiskeli. Ili kuweka usawa lazima uendelee kusogea."
"Imagination is more important than knowledge." = "Mawazo ni muhimu zaidi kuliko elimu."
"No need to hurry. No need to sparkle. No need to be anybody but oneself." = "Hakuna haja ya haraka. Hakuna haja ya kumetameta. Hakuna haja ya kuwa mtu mwingine isipokuwa mwenyewe."
"Attention is the rarest and purest form of generosity." = "Makini ni namna adimu na safi zaidi ya ukarimu."
"Think of all the beauty still left around you and be happy." = "Fikiria uzuri wote uliobaki karibu yako na uwe na furaha."
"It is only with the heart that one can see rightly; what is essential is invisible to the eye." = "Ni kwa moyo tu mtu anaweza kuona sawa; kilicho muhimu hakionekani kwa jicho."
"The first principle is that you must not fool yourself, and you are the easiest person to fool." = "Kanuni ya kwanza ni usijidanganye, na wewe ndiye mtu rahisi zaidi wa kujidanganya."
"You can't use up creativity. The more you use, the more you have." = "Huwezi kumaliza ubunifu. Unapotumia zaidi, unakuwa na zaidi."
"Proverbs are the palm-oil with which words are eaten." = "Methali ni mafuta ya mchikichi ambayo maneno huliwa nayo."
"The world is like a Mask dancing. If you want to see it well, you do not stand in one place." = "Ulimwengu ni kama Barakoa inayocheza. Ukitaka kuuona vizuri, husimami mahali pamoja."
"When there is a big tree small ones climb on its back to reach the sun." = "Kukiwa na mti mkubwa midogo hupanda mgongoni mwake kufikia jua."
"I learned that courage was not the absence of fear, but the triumph over it." = "Nilijifunza kwamba ujasiri si kutokuwepo kwa hofu, bali ushindi juu yake."
"A good head and a good heart are always a formidable combination." = "Kichwa kizuri na moyo mzuri daima ni mchanganyiko wa kutisha."
"It is in the character of growth that we should learn from both pleasant and unpleasant experiences." = "Ni katika tabia ya ukuaji kwamba tujifunze kutoka uzoefu wa kupendeza na usiopendeza."
"Love is so powerful, it's like unseen flowers under your feet as you walk." = "Upendo una nguvu sana, ni kama maua yasiyoonekana chini ya miguu yako unapotembea."
"Life is not in bits and pieces. It is a magnificent, rhythmic, pulsating symphony." = "Maisha si vipande vipande. Ni simfoni tukufu, yenye mdundo, inayopiga."
"Hurry, hurry has no blessings." = "Haraka, haraka haina baraka."
"The sages were not ashamed to find themselves convinced; for they knew, being wise, that their knowledge was not infinite." = "Wenye hekima hawakuaibika kujikuta wameshawishika; kwa maana walijua, wakiwa na hekima, kwamba elimu yao haikuwa isiyo na mwisho."
"To beautify life is to give it an object." = "Kupamba maisha ni kuyapa lengo."
"A grain of poetry suffices to season a century." = "Punje ya ushairi inatosha kuonja karne."
"Little feet of children, two tiny suffering jewels, how can people pass and not see you!" = "Miguu midogo ya watoto, vito viwili vidogo vinavyoteseka, watu wanapita vipi bila kukuona!"
"Writing is nothing more than a guided dream." = "Kuandika si chochote zaidi ya ndoto iliyoongozwa."
"Feet, what do I need them for if I have wings to fly." = "Miguu, ninaihitaji kwa nini nikiwa na mabawa ya kuruka."
"I am not sick. I am broken. But I am happy to be alive as long as I can paint." = "Mimi si mgonjwa. Nimevunjika. Lakini nina furaha kuwa hai maadamu naweza kuchora."
"I must live little by little, it's no good living everything at once." = "Lazima niishi kidogo kidogo, si vizuri kuishi kila kitu kwa wakati mmoja."
"Life is not what one lived, but what one remembers and how one remembers it in order to recount it." = "Maisha si aliyoishi mtu, bali anachokumbuka na jinsi anavyokumbuka ili ayasimulishe."
"Fear is inevitable, I have to accept that, but I cannot allow it to paralyze me." = "Hofu haiwezi kuepukwa, lazima nikubali hilo, lakini siwezi kuiruhusu inilemeze."

"Sway reads Mandara's file where your config includes it. Mandara adds that line at the end, so its colours and gaps apply over the settings above it, but not over any you add below it. Mandara sets no rounded corners, opacity, blur, shadows or animations on Sway; the bar's layout pill cycles through the focused container's layouts." = "O Sway lê o arquivo do Mandara onde sua configuração o inclui. O Mandara adiciona essa linha no final, então suas cores e espaçamentos prevalecem sobre as opções acima, mas não sobre as adicionadas abaixo. O Mandara não define cantos arredondados, opacidade, desfoque, sombras nem animações no Sway; o indicador de layout da barra alterna os layouts do contêiner em foco."

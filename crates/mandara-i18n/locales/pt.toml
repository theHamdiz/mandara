"A man does not attain everything that he desires; the winds convey whither the ships do not list." = "Um homem não alcança tudo o que deseja; os ventos levam para onde os navios não se inclinam."
"A charger's saddle is an exalted throne, the best companions are books alone." = "A sela de um corcel é um trono elevado; os melhores companheiros são só os livros."
"If you venture in pursuit of glory, don't be satisfied with less than the stars." = "Se você partir em busca da glória, não se contente com menos que as estrelas."
"The past resembles the future more than water resembles water." = "O passado se parece com o futuro mais do que a água se parece com a água."
"Skills are acquired only through the repetition of actions." = "As habilidades só se adquirem pela repetição dos atos."
"The knowledge of anything, since all things have causes, is not acquired or complete unless it is known by its causes." = "O conhecimento de qualquer coisa, já que tudo tem causas, não se adquire nem se completa sem conhecê-la pelas causas."
"The less reason someone has, the more he fancies himself the most rational and most discerning of all." = "Quanto menos razão alguém tem, mais se imagina o mais racional e o mais perspicaz de todos."
"Friendship is always a sweet responsibility, never an opportunity." = "A amizade é sempre uma responsabilidade doce, nunca uma oportunidade."
"A sense of humour is a sense of proportion." = "O senso de humor é um senso de proporção."
"If you sing of beauty though alone in the heart of the desert you will have an audience." = "Se você cantar a beleza, mesmo sozinho no coração do deserto, terá uma plateia."
"Work is love made visible." = "O trabalho é o amor tornado visível."
"You give but little when you give of your possessions. It is when you give of yourself that you truly give." = "Você dá pouco quando dá do que possui. É quando dá de si que você realmente dá."
"Patience is man's refuge in times of despair, and his armor against misfortunes." = "A paciência é o refúgio do homem no desespero, e a armadura contra os infortúnios."
"Knowledge is like water and air: it is every citizen's right to enjoy it for free." = "O conhecimento é como a água e o ar: é direito de cada pessoa desfrutá-lo de graça."
"Time is like a sword; if you don't cut it, it'll cut you." = "O tempo é como uma espada; se você não o corta, ele corta você."
"All men by nature desire to know." = "Todos, por natureza, desejam conhecer."
"For the things we have to learn before we can do, we learn by doing." = "O que precisamos aprender antes de fazer, aprendemos fazendo."
"The roots of education are bitter, but the fruit is sweet." = "As raízes da educação são amargas, mas o fruto é doce."
"The beginning is the most important part of any work." = "O começo é a parte mais importante de qualquer obra."
"You could not step twice into the same river." = "Você não pode entrar duas vezes no mesmo rio."
"While we are postponing, life speeds by." = "Enquanto adiamos, a vida passa depressa."
"We suffer more often in imagination than in reality." = "Sofremos mais vezes na imaginação do que na realidade."
"It is not that we have a short space of time, but that we waste much of it." = "Não é que o tempo seja curto, é que desperdiçamos muito dele."
"He who receives a benefit with gratitude, repays the first installment of it." = "Quem recebe um benefício com gratidão paga a primeira parcela dele."
"Fire tries gold, misfortune tries brave men." = "O fogo prova o ouro; o infortúnio prova os bravos."
"No longer talk at all about the kind of man that a good man ought to be, but be such." = "Pare de falar do tipo de pessoa que uma boa pessoa deveria ser, e seja essa pessoa."
"Very little indeed is necessary for living a happy life." = "Muito pouco é necessário para viver uma vida feliz."
"Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig." = "Olhe para dentro. Lá está a fonte do bem, e ela sempre brota, se você continuar cavando."
"If it is not right, do not do it: if it is not true, do not say it." = "Se não é certo, não faça; se não é verdade, não diga."
"Confine thyself to the present." = "Fique no presente."
"First say to yourself what you would be; and then do what you have to do." = "Primeiro diga a si mesmo o que você quer ser; depois faça o que precisa fazer."
"No thing great is created suddenly, any more than a bunch of grapes or a fig." = "Nada grande nasce de repente, tanto quanto um cacho de uvas ou um figo."
"Men are disturbed not by things, but by the views which they take of things." = "As pessoas não se perturbam com as coisas, e sim com a visão que têm delas."
"He who has begun has half done. Dare to be wise; begin!" = "Quem começou já fez a metade. Ouse ser sábio; comece."
"Practice is the best of all instructors." = "A prática é a melhor das mestras."
"Anyone can hold the helm when the sea is calm." = "Qualquer um segura o leme quando o mar está calmo."
"They can because they think they can." = "Eles conseguem porque acham que conseguem."
"If you have a garden and a library, you have everything you need." = "Se você tem um jardim e uma biblioteca, tem tudo de que precisa."
"Drops of water hollow out a stone." = "Gotas de água cavam a pedra."
"Slow and steady wins the race." = "Devagar e constante vence a corrida."
"Is it not pleasant to learn with a constant perseverance and application?" = "Não é agradável aprender com perseverança e aplicação constantes?"
"If a man keeps cherishing his old knowledge, so as continually to be acquiring new, he may be a teacher of others." = "Se alguém cultiva o que já sabe, de modo a continuar adquirindo o novo, pode ensinar os outros."
"Learning without thought is labour lost; thought without learning is perilous." = "Aprender sem pensar é trabalho perdido; pensar sem aprender é perigoso."
"When I walk along with two others, they may serve me as my teachers." = "Quando caminho com duas pessoas, elas podem me servir de mestras."
"When the year becomes cold, then we know how the pine and the cypress are the last to lose their leaves." = "Quando o ano esfria, vemos como o pinheiro e o cipreste são os últimos a perder as folhas."
"Do not be desirous to have things done quickly; do not look at small advantages." = "Não queira que as coisas se façam depressa; não olhe para vantagens pequenas."
"What you do not want done to yourself, do not do to others." = "O que você não quer que façam com você, não faça com os outros."
"The journey of a thousand li commenced with a single step." = "A jornada de mil li começou com um único passo."
"He who knows other men is discerning; he who knows himself is intelligent." = "Quem conhece os outros é perspicaz; quem se conhece é inteligente."
"He who overcomes others is strong; he who overcomes himself is mighty." = "Quem vence os outros é forte; quem se vence é poderoso."
"The soft overcomes the hard; and the weak the strong." = "O macio vence o duro; e o fraco, o forte."
"The great man is the one who does not lose his child's heart." = "A pessoa grande é a que não perde o coração de criança."
"You cannot speak of ocean to a well-frog." = "Não se fala de oceano a um sapo do poço."
"If you know the enemy and know yourself, you need not fear the result of a hundred battles." = "Se você conhece o inimigo e se conhece, não precisa temer o resultado de cem batalhas."
"Let right deeds be thy motive, not the fruit which comes from them." = "Que os atos certos sejam o seu motivo, não o fruto que vem deles."
"Hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule." = "O ódio não acaba pelo ódio em nenhum tempo: o ódio acaba pelo amor, esta é uma regra antiga."
"As a solid rock is not shaken by the wind, wise people falter not amidst blame and praise." = "Como uma rocha firme não se abala com o vento, as pessoas sábias não vacilam entre a culpa e o elogio."
"Real kindness seeks no return; what return can the world make to rain clouds?" = "A bondade verdadeira não pede retorno; que retorno o mundo pode dar às nuvens de chuva?"
"To use bitter words, when kind words are at hand, is like picking unripe fruit when the ripe fruit is there." = "Usar palavras amargas quando as gentis estão à mão é como colher o fruto verde quando o maduro está ali."
"If you shed tears when you miss the sun, you also miss the stars." = "Se você chora quando sente falta do sol, também perde as estrelas."
"We come nearest to the great when we are great in humility." = "Chegamos mais perto dos grandes quando somos grandes na humildade."
"If you shut your door to all errors truth will be shut out." = "Se você fecha a porta a todos os erros, a verdade fica de fora."
"The roots below the earth claim no rewards for making the branches fruitful." = "As raízes sob a terra não pedem recompensa por tornar os galhos frutíferos."
"He who is too busy doing good finds no time to be good." = "Quem está ocupado demais fazendo o bem não encontra tempo para ser bom."
"Let your life lightly dance on the edges of Time like dew on the tip of a leaf." = "Deixe a sua vida dançar leve nas bordas do Tempo, como o orvalho na ponta de uma folha."
"If you are irritated by every rub, how will your mirror be polished?" = "Se cada atrito irrita você, como o seu espelho será polido?"
"If you are wholly perplexed and in straits, have patience, for patience is the key to joy." = "Se você está perdido e apertado, tenha paciência, pois a paciência é a chave da alegria."
"Come, seek, for search is the foundation of fortune: every success depends upon focusing the heart." = "Venha, busque, pois a busca é o fundamento da fortuna: todo sucesso depende de concentrar o coração."
"If thou covetest riches, ask not but for contentment, which is an immense treasure." = "Se você cobiça riquezas, peça só o contentamento, que é um tesouro imenso."
"Use a sweet tongue, courtesy, and gentleness, and thou mayst manage to guide an elephant with a hair." = "Use uma língua doce, cortesia e delicadeza, e você pode guiar um elefante com um fio de cabelo."
"Were the diver to think on the jaws of the shark, he would never lay hands on the precious pearl." = "Se o mergulhador pensasse nas mandíbulas do tubarão, nunca poria as mãos na pérola preciosa."
"How well said the aged farmer to his son, O light of my eyes, thou wilt not reap save that which thou hast sown." = "Como disse bem o velho lavrador ao filho: ó luz dos meus olhos, você só colhe o que semeou."
"Ah, make the most of what we yet may spend, before we too into the Dust descend." = "Ah, aproveite o que ainda podemos gastar, antes de também descermos ao pó."
"Mighty is he who has knowledge." = "Poderoso é quem tem conhecimento."
"It is in general the unexplored that attracts us." = "Em geral, é o inexplorado que nos atrai."
"Leave undone whatever you hesitate to do." = "Deixe por fazer aquilo em que você hesita."
"Seek not the paths of the ancients; seek that which the ancients sought." = "Não busque os caminhos dos antigos; busque o que os antigos buscavam."
"Every day is a journey, and the journey itself is home." = "Cada dia é uma viagem, e a viagem em si é a casa."
"The old pond: a frog jumps in — the sound of the water." = "O velho lago: um sapo salta — o som da água."
"Step by step walk the thousand-mile road." = "Passo a passo se caminha a estrada de mil milhas."
"Think lightly of yourself and deeply of the world." = "Pense leve de si e fundo do mundo."
"Let us dream of evanescence, and linger in the beautiful foolishness of things." = "Sonhemos com o que passa, e demoremos na bela tolice das coisas."
"Fall down seven times, get up eight." = "Caia sete vezes, levante oito."
"Even monkeys fall from trees." = "Até os macacos caem das árvores."
"Ye were not made to live like unto brutes, but for pursuit of virtue and of knowledge." = "Vocês não foram feitos para viver como brutos, e sim para buscar a virtude e o conhecimento."
"This above all: to thine own self be true." = "Acima de tudo: seja fiel a si mesmo."
"There is nothing either good or bad, but thinking makes it so." = "Nada é bom ou mau por si; o pensamento é que torna assim."
"Our doubts are traitors, and make us lose the good we oft might win, by fearing to attempt." = "As nossas dúvidas são traidoras, e nos fazem perder o bem que muitas vezes poderíamos ganhar, por medo de tentar."
"Diligence is the mother of good fortune." = "A diligência é a mãe da boa sorte."
"Tell me what company thou keepest, and I'll tell thee what thou art." = "Diga com quem você anda, e eu digo quem você é."
"The greatest thing in the world is to know how to belong to oneself." = "A maior coisa do mundo é saber pertencer a si mesmo."
"Reading maketh a full man; conference a ready man; and writing an exact man." = "A leitura faz uma pessoa plena; a conversa, uma pessoa pronta; e a escrita, uma pessoa precisa."
"If I have seen further it is by standing on the shoulders of Giants." = "Se vi mais longe, foi por estar sobre os ombros de gigantes."
"I would have written a shorter letter, but I did not have the time." = "Eu teria escrito uma carta mais curta, mas não tive tempo."
"Well done is better than well said." = "Bem feito vale mais que bem dito."
"Let us cultivate our garden." = "Cultivemos o nosso jardim."
"Great works are performed not by strength, but perseverance." = "As grandes obras se fazem não pela força, e sim pela perseverança."
"To err is human, to forgive divine." = "Errar é humano, perdoar é divino."
"A talent is formed in stillness, a character in the world's torrent." = "Um talento se forma na quietude, um caráter na torrente do mundo."
"It is not enough to know, we must also apply; it is not enough to will, we must also do." = "Não basta saber, é preciso aplicar; não basta querer, é preciso fazer."
"I do not wish them to have power over men; but over themselves." = "Não quero que tenham poder sobre as pessoas, e sim sobre si mesmas."
"One half of the world cannot understand the pleasures of the other." = "Metade do mundo não consegue entender os prazeres da outra."
"Nothing is so painful to the human mind as a great and sudden change." = "Nada dói tanto à mente humana quanto uma mudança grande e súbita."
"I am no bird; and no net ensnares me; I am a free human being with an independent will." = "Não sou um pássaro, e nenhuma rede me prende; sou uma pessoa livre, com vontade própria."
"Nothing great was ever achieved without enthusiasm." = "Nada grande se fez sem entusiasmo."
"Write it on your heart that every day is the best day in the year." = "Escreva no coração que cada dia é o melhor dia do ano."
"Simplify, simplify." = "Simplifique, simplifique."
"Rather than love, than money, than fame, give me truth." = "Em vez de amor, de dinheiro, de fama, dê-me a verdade."
"A man who dares to waste one hour of time has not discovered the value of life." = "Quem ousa desperdiçar uma hora não descobriu o valor da vida."
"The Analytical Engine weaves algebraical patterns just as the Jacquard-loom weaves flowers and leaves." = "A Máquina Analítica tece padrões algébricos como o tear Jacquard tece flores e folhas."
"Everything comes in time to him who knows how to wait." = "Tudo chega a tempo para quem sabe esperar."
"What do we live for, if it is not to make life less difficult to each other?" = "Para que vivemos, se não for para tornar a vida menos difícil uns para os outros?"
"To live is so startling, it leaves but little room for other occupations." = "Viver é tão espantoso que deixa pouco espaço para outras ocupações."
"I'm not afraid of storms, for I'm learning how to sail my ship." = "Não tenho medo de tempestades, porque estou aprendendo a conduzir o meu barco."
"Begin at the beginning, and go on till you come to the end: then stop." = "Comece pelo começo e siga até o fim: então pare."
"No one is useless in this world who lightens the burden of it for any one else." = "Ninguém é inútil neste mundo se alivia o fardo dele para outra pessoa."
"Courage is resistance to fear, mastery of fear—not absence of fear." = "Coragem é resistir ao medo, dominar o medo — não a ausência de medo."
"When in doubt, tell the truth." = "Na dúvida, diga a verdade."
"Brevity is the sister of talent." = "A brevidade é irmã do talento."
"One never notices what has been done; one can only see what remains to be done." = "Nunca se nota o que já foi feito; só se vê o que ainda falta fazer."
"We must have perseverance and above all confidence in ourselves." = "Precisamos de perseverança e, acima de tudo, de confiança em nós."
"Optimism is the faith that leads to achievement; nothing can be done without hope." = "O otimismo é a fé que leva à realização; nada se faz sem esperança."
"Although the world is full of suffering, it is full also of the overcoming of it." = "Embora o mundo esteja cheio de sofrimento, também está cheio de superação."
"Life is like riding a bicycle. To keep your balance you must keep moving." = "A vida é como andar de bicicleta. Para manter o equilíbrio, é preciso continuar em movimento."
"Imagination is more important than knowledge." = "A imaginação é mais importante que o conhecimento."
"No need to hurry. No need to sparkle. No need to be anybody but oneself." = "Não precisa correr. Não precisa brilhar. Não precisa ser ninguém além de si."
"Attention is the rarest and purest form of generosity." = "A atenção é a forma mais rara e mais pura de generosidade."
"Think of all the beauty still left around you and be happy." = "Pense em toda a beleza que ainda resta ao seu redor e seja feliz."
"It is only with the heart that one can see rightly; what is essential is invisible to the eye." = "Só se vê bem com o coração; o essencial é invisível aos olhos."
"The first principle is that you must not fool yourself, and you are the easiest person to fool." = "O primeiro princípio é não enganar a si mesmo, e você é a pessoa mais fácil de enganar."
"You can't use up creativity. The more you use, the more you have." = "Não se esgota a criatividade. Quanto mais você usa, mais tem."
"Proverbs are the palm-oil with which words are eaten." = "Os provérbios são o azeite de dendê com que se comem as palavras."
"The world is like a Mask dancing. If you want to see it well, you do not stand in one place." = "O mundo é como uma Máscara dançando. Se você quer vê-lo bem, não fica parado num lugar só."
"When there is a big tree small ones climb on its back to reach the sun." = "Quando há uma árvore grande, as pequenas sobem nas costas dela para alcançar o sol."
"I learned that courage was not the absence of fear, but the triumph over it." = "Aprendi que coragem não era a ausência de medo, e sim o triunfo sobre ele."
"A good head and a good heart are always a formidable combination." = "Uma boa cabeça e um bom coração são sempre uma combinação formidável."
"It is in the character of growth that we should learn from both pleasant and unpleasant experiences." = "Faz parte do crescimento aprender tanto com o que agrada quanto com o que não agrada."
"Love is so powerful, it's like unseen flowers under your feet as you walk." = "O amor é tão poderoso que parece flores invisíveis sob os seus pés enquanto você caminha."
"Life is not in bits and pieces. It is a magnificent, rhythmic, pulsating symphony." = "A vida não é em pedaços. É uma sinfonia magnífica, rítmica e pulsante."
"Hurry, hurry has no blessings." = "Pressa, pressa não tem bênção."
"The sages were not ashamed to find themselves convinced; for they knew, being wise, that their knowledge was not infinite." = "Os sábios não se envergonhavam de se ver convencidos; pois sabiam, sendo sábios, que o conhecimento deles não era infinito."
"To beautify life is to give it an object." = "Embelezar a vida é dar a ela um objeto."
"A grain of poetry suffices to season a century." = "Um grão de poesia basta para temperar um século."
"Little feet of children, two tiny suffering jewels, how can people pass and not see you!" = "Pezinhos de crianças, duas joias minúsculas que sofrem, como as pessoas passam e não veem vocês!"
"Writing is nothing more than a guided dream." = "Escrever não é mais que um sonho guiado."
"Feet, what do I need them for if I have wings to fly." = "Pés, para que preciso deles se tenho asas para voar."
"I am not sick. I am broken. But I am happy to be alive as long as I can paint." = "Não estou doente. Estou quebrada. Mas estou feliz de estar viva enquanto puder pintar."
"I must live little by little, it's no good living everything at once." = "Preciso viver aos poucos, não adianta viver tudo de uma vez."
"Life is not what one lived, but what one remembers and how one remembers it in order to recount it." = "A vida não é o que se viveu, e sim o que se lembra e como se lembra para contar."
"Fear is inevitable, I have to accept that, but I cannot allow it to paralyze me." = "O medo é inevitável, tenho de aceitar isso, mas não posso deixar que me paralise."
